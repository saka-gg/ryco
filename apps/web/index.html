<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="apple-mobile-web-app-title" content="Ryco" />
    <script>
      // The only inline script: the hosted Hub's content security policy allows
      // exactly one, by hash. The mark comes first because the entry marks only
      // begin once the deferred module script runs, which would leave the earlier
      // HTML parse and theme setup out of the startup timeline.
      performance.mark("ryco:startup:html");
      (() => {
        const LIGHT_BACKGROUND = "#ffffff";
        const DARK_BACKGROUND = "#0b0b0c";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
        const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
        document.documentElement.style.backgroundColor = chromeColor;
        themeColorMeta?.setAttribute("content", chromeColor);
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #ffffff;
        color: #262626;
        font-family:
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #0b0b0c;
        color: #f5f5f5;
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      /* Inline SVG rather than an icon file: the mark paints on the first
         frame with no extra request, and `currentColor` picks up the body
         colour the inline theme script above already resolved. */
      #boot-shell-logo {
        width: auto;
        height: 64px;
        animation: boot-logo-pulse 1.4s ease-in-out infinite;
      }

      @keyframes boot-logo-pulse {
        0%,
        100% {
          opacity: 0.74;
          transform: scale(0.985);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-shell-logo {
          animation: none;
        }
      }
    </style>
    <title>Ryco (Alpha)</title>
    <script type="module">
      const appendDeferredHeadLink = (attributes) => {
        const link = document.createElement("link");
        for (const [name, value] of Object.entries(attributes)) {
          link.setAttribute(name, value);
        }
        document.head.append(link);
      };

      window.addEventListener(
        "load",
        () => {
          appendDeferredHeadLink({
            rel: "icon",
            type: "image/png",
            href: "/favicon-96x96.png",
            sizes: "96x96",
          });
          appendDeferredHeadLink({ rel: "shortcut icon", href: "/favicon.ico" });
          appendDeferredHeadLink({
            rel: "apple-touch-icon",
            sizes: "180x180",
            href: "/apple-touch-icon.png",
          });
          if (import.meta.env.VITE_RYCO_CLIENT_MODE === "hosted-hub") {
            appendDeferredHeadLink({
              rel: "manifest",
              href: `${import.meta.env.BASE_URL}site.webmanifest`,
            });
          }
        },
        { once: true },
      );
      performance.mark("ryco:startup:web-entry.import-start");
      void import("/src/main.tsx").finally(() => {
        performance.mark("ryco:startup:web-entry.import-end");
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Ryco splash screen">
          <svg
            id="boot-shell-logo"
            viewBox="414.46 386.67 425.09 480.61"
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            aria-hidden="true"
          >
            <g transform="matrix(0.125617,0,0,-0.125617,-180.839814,1610.932617)">
              <path
                d="M6035,9744C5514,9700 5112,9433 4886,8982C4838,8886 4786,8729 4764,8610L4746,8515L4742,7231L4739,5947L4758,5928L4796,5962C4818,5981 4975,6121 5147,6273L5459,6550L5462,7502L5465,8455L5491,8532C5576,8779 5754,8952 6002,9028L6055,9044L6605,9048C6908,9050 7178,9049 7206,9045L7258,9039L7364,8975L7392,8930C7407,8905 7424,8863 7429,8835L7438,8786L7429,8725C7424,8692 7406,8636 7389,8601L7358,8538L7295,8474L7233,8411L7161,8376L7088,8341L7032,8335C6708,8298 6509,8207 6296,7996C6187,7889 6155,7846 5901,7472L5708,7188L5714,7167C5717,7155 5741,7123 5768,7095C5794,7068 5840,7016 5870,6980C5919,6922 6037,6786 6370,6405C6428,6340 6528,6225 6594,6150C6659,6076 6732,5994 6757,5968L6801,5920L7710,5920L7710,5933C7710,5939 7666,5997 7612,6061C7503,6191 7498,6197 7009,6774C6599,7259 6590,7270 6590,7283C6590,7305 6683,7421 6753,7486L6827,7555L6975,7629L7040,7640C7076,7646 7148,7659 7200,7670C7628,7751 8003,8123 8102,8563L8123,8655L8122,8795L8122,8935L8097,9030C8048,9217 7971,9350 7832,9482C7695,9612 7569,9680 7385,9723L7295,9743L6685,9745C6350,9746 6057,9746 6035,9744Z"

        </div>

</html>
