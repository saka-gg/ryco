<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo is variable on width (62–125) and weight; the kinetic headlines
         animate both axes. DM Sans is the Ryco app's own UI face, so the coded
         product replica renders in the real typeface. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=DM+Sans:opsz,wght@9..40,400..700&family=Geist+Mono:wght@400..600&display=swap"
    />
    <title>Ryco. Every coding agent, one workspace.</title>
    <meta
      name="description"
      content="Ryco runs Codex, Claude, GitHub Copilot, OpenCode, Cursor and Grok side by side. A fast, local-first desktop app and web CLI, with optional Ryco Cloud to reach your machines from anywhere."
    />
    <meta property="og:title" content="Ryco. Every coding agent, one workspace." />
    <meta
      property="og:description"
      content="Run every coding agent side by side. Worktrees, terminals, diffs, MCP and remote access. Local-first and open source."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/ryco-logo-full.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
