name: Setup Ryco
description: Install the Vite+, Bun, and Node toolchains, restore build caches, and optionally install dependencies.

inputs:
  install-dependencies:
    description: Run bun install --frozen-lockfile after toolchain setup.
    required: false
    default: "true"
  install-args:
    description: >
      Extra arguments appended to `bun install --frozen-lockfile`, split on
      spaces and newlines, e.g. `--filter=./ --filter=@ryco/desktop` for a job
      that only needs some workspaces installed.
    required: false
    default: ""
  registry-url:
    description: Optional npm registry URL for publish jobs.
    required: false
    default: ""
  vite-plus-version:
    description: Vite+ CLI version. Keep aligned with package.json workspaces.catalog.vite-plus.
    required: false
    default: "1.1.0"
  install-resource-monitor-toolchain:
    description: Install Rust for jobs that build the server resource monitor.
    required: false
    default: "true"
  cache-scope:
    description: >
      Discriminator for this job's Turbo cache entry; required unless
      restore-turbo-cache is "false". Every job in a workflow run restores and
      saves concurrently, and GitHub's cache backend only lets one writer
      reserve a given key, so a shared key means exactly one job's artifacts
      survive and the other writers are dropped. Give each job a distinct scope
      (matrix legs included) so every job keeps its own slice.
    required: false
    default: ""
  restore-turbo-cache:
    description: >
      Restore `.turbo/cache`. Pass "false" in jobs that run no cacheable Turbo
      task (tests, browser shards, release publishing): otherwise the
      cross-scope fallback downloads another job's cache for nothing. The
      turbo-cache-key output is then empty, so the job saves nothing either.
    required: false
    default: "true"
  bun-cache:
    description: >
      Bun install cache mode. "read" restores it. "write" also saves it after a
      successful job that missed the lockfile's key; give exactly one job per
      workflow run "write", because concurrent writers each compress about a
      gigabyte and all but one then fail to reserve the key. "none" neither
      restores nor saves it, nor setup-bun's binary cache: release jobs use it
      because main-scope caches can be written by validation runs of unmerged
      code, and a release must not install from them.
    required: false
    default: "read"

outputs:
  turbo-cache-key:
    description: >
      Primary key the Turbo cache was restored under, or empty when
      restore-turbo-cache is "false". Pass it to
      `./.github/actions/save-turbo-cache` at the end of the job, guarded by
      `if: !cancelled() && steps.<id>.outputs['turbo-cache-key'] != ''`.
      That saves failed jobs too (`actions/cache` skips its own save when the
      job fails, which is precisely when re-running the same expensive tasks
      costs the most), but not cancelled ones, which are usually superseded and
      would claim the per-commit key with a partial cache.
    value: ${{ steps.turbo-cache-key.outputs.key }}

runs:
  using: composite
  steps:
    - name: Check cache inputs
      shell: bash
      env:
        BUN_CACHE: ${{ inputs['bun-cache'] }}
        RESTORE_TURBO_CACHE: ${{ inputs['restore-turbo-cache'] }}
        CACHE_SCOPE: ${{ inputs['cache-scope'] }}
      run: |
        case "$BUN_CACHE" in
          read | write | none) ;;
          *)
            echo "::error::setup-ryco: bun-cache must be read, write, or none, not '$BUN_CACHE'."
            exit 1
            ;;
        esac
        case "$RESTORE_TURBO_CACHE" in
          false) ;;
          true)
            if [ -z "$CACHE_SCOPE" ]; then
              echo "::error::setup-ryco: cache-scope is required when restore-turbo-cache is true."
              exit 1
            fi
            ;;
          *)
            echo "::error::setup-ryco: restore-turbo-cache must be true or false, not '$RESTORE_TURBO_CACHE'."
            exit 1
            ;;
        esac

    # Playwright installs its pinned Chromium and uses Ubuntu for system
    # dependencies. The runner's unrelated Chrome feed can publish mismatched
    # indexes and make that dependency installation fail before tests start.
    - name: Remove unused Chrome package source
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources

    - name: Setup Vite+
      if: ${{ runner.os != 'Windows' }}
      uses: voidzero-dev/setup-vp@v1
      with:
        version: ${{ inputs['vite-plus-version'] }}
        node-version-file: package.json
        # The Bun install cache is restored below instead, so every OS shares
        # one key scheme and bun-cache decides who may write it.
        cache: false
        registry-url: ${{ inputs['registry-url'] }}
        run-install: false

    # The upstream PowerShell installer currently evaluates a byte-array response
    # as script text. Windows can use the lockfile-pinned local Vite+ CLI instead.
    - name: Setup Node on Windows
      if: ${{ runner.os == 'Windows' }}
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        registry-url: ${{ inputs['registry-url'] }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
        no-cache: ${{ inputs['bun-cache'] == 'none' }}

    # Bun links packages from its cache with hardlinks, which cannot cross
    # volumes. The default cache under the home directory is on C:, but
    # windows-2025 checkouts live on D:, so Bun copied every file there;
    # runner.temp shares the workspace volume on every runner. The cache steps
    # below repeat this path verbatim because actions/cache versions entries by
    # their path string.
    - name: Configure Bun install cache
      id: bun-cache
      shell: bash
      env:
        CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        LOCK_HASH: ${{ hashFiles('bun.lock') }}
      run: |
        echo "BUN_INSTALL_CACHE_DIR=${CACHE_DIR}" >> "$GITHUB_ENV"
        {
          echo "key=bun-install-${RUNNER_OS}-${RUNNER_ARCH}-${LOCK_HASH}"
          echo "restore-prefix=bun-install-${RUNNER_OS}-${RUNNER_ARCH}-"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Bun install cache
      if: ${{ inputs['bun-cache'] == 'read' }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/bun-install-cache
        key: ${{ steps.bun-cache.outputs.key }}
        restore-keys: ${{ steps.bun-cache.outputs['restore-prefix'] }}

    # Same restore, plus a post-job save when the job succeeds and the exact
    # key was missed (a lockfile change).
    - name: Restore and save Bun install cache
      if: ${{ inputs['bun-cache'] == 'write' }}
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/bun-install-cache
        key: ${{ steps.bun-cache.outputs.key }}
        restore-keys: ${{ steps.bun-cache.outputs['restore-prefix'] }}

    - name: Setup pinned resource monitor toolchain
      if: ${{ inputs['install-resource-monitor-toolchain'] == 'true' }}
      shell: bash
      run: rustup toolchain install 1.95.0 --profile minimal

    - name: Compute Turbo cache key
      id: turbo-cache-key
      if: ${{ inputs['restore-turbo-cache'] == 'true' }}
      shell: bash
      env:
        SCOPE: ${{ inputs['cache-scope'] }}
        LOCK_HASH: ${{ hashFiles('bun.lock') }}
        TURBO_HASH: ${{ hashFiles('turbo.json') }}
        SHA: ${{ github.sha }}
      run: |
        # Slashes are legal in cache keys but noisy in logs; matrix legs like
        # "1/2" become "1-2".
        scope="${SCOPE//\//-}"
        prefix="${RUNNER_OS}-turbo-${scope}-${LOCK_HASH}-${TURBO_HASH}"
        {
          echo "key=${prefix}-${SHA}"
          echo "restore-prefix=${prefix}-"
          echo "scope-prefix=${RUNNER_OS}-turbo-${scope}-"
          echo "shared-prefix=${RUNNER_OS}-turbo-"
        } >> "$GITHUB_OUTPUT"
        # save-turbo-cache keeps only the entries named in the job's run
        # summaries. Callers pass --summarize too; the variable also covers a
        # Turbo run that omits it. It does not change task hashes.
        echo "TURBO_RUN_SUMMARY=true" >> "$GITHUB_ENV"

    - name: Restore Turbo cache
      if: ${{ inputs['restore-turbo-cache'] == 'true' }}
      uses: actions/cache/restore@v5
      with:
        # Only the artifact store. `.turbo` also holds the daemon socket, run
        # summaries, and logs, none of which are safe or useful to carry across
        # machines.
        path: .turbo/cache
        # Per-commit key so every run writes a fresh entry (GitHub never
        # overwrites an existing key — a lockfile-stable key froze the cache at
        # its first run and never re-saved). restore-keys seed each run from the
        # most recent prefix match, and save-turbo-cache prunes each save to the
        # entries its run used, so the cache stays small instead of
        # accumulating commit-to-commit.
        key: ${{ steps.turbo-cache-key.outputs.key }}
        # Narrowest match first: this job's own history, then this job's history
        # across dependency/config changes, then any job's cache. Turbo entries
        # are content-addressed by task hash, so the cross-scope fallback can
        # only ever add usable entries. It is what lets a job that has never
        # run before (a new matrix leg, a release job) start warm.
        restore-keys: |
          ${{ steps.turbo-cache-key.outputs['restore-prefix'] }}
          ${{ steps.turbo-cache-key.outputs['scope-prefix'] }}
          ${{ steps.turbo-cache-key.outputs['shared-prefix'] }}

    # A job whose Turbo tasks are all cache hits (or that runs no Turbo task at
    # all) leaves `.turbo/cache` absent, and `actions/cache/save` treats a
    # missing path as a hard error. Materialize it so the save step is always
    # safe to run.
    - name: Ensure Turbo cache directory exists
      if: ${{ inputs['restore-turbo-cache'] == 'true' }}
      shell: bash
      run: mkdir -p .turbo/cache

    - name: Install dependencies
      if: ${{ inputs['install-dependencies'] == 'true' }}
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs['install-args'] }}
      run: |
        # Split on spaces and newlines (a `|` block input has one per line)
        # without glob expansion of patterns like @ryco/*. `read -d ''` reads
        # to end of input and then returns 1, which must not trip `-e`.
        read -r -d '' -a args <<< "$INSTALL_ARGS" || true
        bun install --frozen-lockfile "${args[@]}"

    - name: Expose local Vite+ CLI on Windows
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: Join-Path $env:GITHUB_WORKSPACE 'node_modules/.bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
