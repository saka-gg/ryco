name: Save Turbo cache
description: Prune .turbo/cache to the task results this job's Turbo runs used, then save it.

inputs:
  key:
    description: >
      The turbo-cache-key output of setup-ryco. Guard the calling step with
      `if: !cancelled() && steps.<id>.outputs['turbo-cache-key'] != ''`
      and pass --summarize to every Turbo run in the job: pruning keeps the
      entries named in `.turbo/runs`, plus recently used ones only when a run
      failed or selected nothing.
    required: true

runs:
  using: composite
  steps:
    # The runner does not enforce required inputs on composite actions.
    - name: Check Turbo cache key
      shell: bash
      env:
        KEY: ${{ inputs.key }}
      run: |
        if [ -z "$KEY" ]; then
          echo "::error::save-turbo-cache: key is empty; guard the step on setup-ryco's turbo-cache-key output."
          exit 1
        fi

    # Restored caches would otherwise grow by every commit's entries forever.
    # A pruning failure only means a larger save, so it must not fail the job.
    - name: Prune Turbo cache
      continue-on-error: true
      shell: bash
      run: bun scripts/ci/prune-turbo-cache.ts

    - name: Save Turbo cache
      uses: actions/cache/save@v5
      with:
        path: .turbo/cache
        key: ${{ inputs.key }}
