self-hosted-runner:
  # Blacksmith runner labels used by the validation and performance workflows.
  labels:
    - blacksmith-2vcpu-ubuntu-2404
    - blacksmith-4vcpu-ubuntu-2404
    - blacksmith-8vcpu-ubuntu-2404
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # GitHub added the workflow- and job-level `cache-mode` key in 2026-09;
      # actionlint 1.7.12 does not know it yet. Drop this once actionlint does.
      - 'unexpected key "cache-mode"'
