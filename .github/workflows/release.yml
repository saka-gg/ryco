name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: false
        type: string

# Every job starts read-only and is granted only what it needs. In particular,
# id-token: write lets a job mint the OIDC token npm trusted publishing accepts,
# so only publish_cli gets it: the build legs run third-party build code.
permissions:
  contents: read

# Release jobs default to no GitHub cache access: each setup passes
# bun-cache: none and restore-turbo-cache: "false", and this default makes the
# cache service enforce it. Only `verify` overrides it (job-level cache-mode
# wins) with `read`: it ships nothing, so it may restore caches but not save
# them. Main-scope cache entries can be written by validation runs of unmerged
# code on backends that do not enforce the read cap (Blacksmith), so nothing
# restored from a cache may end up in a shipped artifact.
cache-mode: none

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Previous-tag resolution reads every release tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-ryco
        with:
          # The release metadata scripts need only the scripts workspace.
          install-args: --filter=@ryco/scripts
          install-resource-monitor-toolchain: "false"
          bun-cache: none
          restore-turbo-cache: "false"

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${DISPATCH_CHANNEL:-stable}" == "nightly" ]]; then
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"

            node scripts/resolve-nightly-release.ts \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output

            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            raw="${DISPATCH_VERSION}"
            if [[ -z "$raw" ]]; then
              echo "workflow_dispatch stable releases require the version input." >&2
              exit 1
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=Ryco v$version" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check npm package version availability
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release_meta.outputs.version }}"
          if npm view "ryco-cli@$version" version --json >/dev/null 2>&1; then
            echo "ryco-cli@$version already exists on npm. Choose a new release version." >&2
            exit 1
          fi

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

  # Release verification reuses CI's verdict when CI already passed on exactly
  # this commit. That does not weaken the gate: a green CI run on the identical
  # SHA ran a superset of what verify runs (format, lint, typecheck, every unit
  # test shard, the build, browser tests, desktop build and release smoke).
  # Only runs on main count: CI's jobs check out the branch tip, and only on
  # main does every push cancel the running CI, so a green run there validated
  # head_sha throughout. Releases from other branches always run verify.
  ci-status:
    name: CI status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
    steps:
      - id: ci
        name: Find a green CI run for the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Any failure to answer means "no": verify then runs in full.
          run_url=""
          if ! run_url="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f status=success -f per_page=100 |
            jq -r --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" \
              'first(.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success" and .head_repository.full_name == $repo) | .html_url) // empty')"; then
            echo "::warning::Could not query CI runs for $RELEASE_SHA; running release verification."
            run_url=""
          fi

          if [[ -n "$run_url" ]]; then
            echo "CI passed on $RELEASE_SHA: $run_url"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful CI run for $RELEASE_SHA; running release verification."
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

  # Starts with the builds once resolve succeeds; nothing is published unless
  # it passes (or was skipped because CI already passed on this commit, see
  # ci-status). Waiting on resolve keeps a bad or already-published version
  # from running the whole validation workflow for a release that cannot
  # publish.
  verify:
    name: Verify
    needs: [resolve, ci-status]
    if: ${{ needs.ci-status.outputs.reuse != 'true' }}
    # Verification ships nothing, so it may restore caches, but a release run
    # must not seed caches that later runs restore.
    cache-mode: read
    uses: ./.github/workflows/_validation.yml
    with:
      checkout-ref: ${{ github.sha }}
      run-browser-tests: false
      # The build legs below produce the real desktop artifacts.
      run-desktop-build: false
      # Cheap, and it exercises the release-only steps (version alignment,
      # nightly metadata, Windows manifest merge) before anything is published.
      run-release-smoke: true

  build:
    name: Build ${{ matrix.label }}
    needs: resolve
    if: ${{ !failure() && !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      # Reads native build caches from earlier release runs' artifacts.
      actions: read
    env:
      # Shipped web bundles compile every module from source instead of reading
      # React Compiler output from a local transform cache.
      RYCO_REACT_COMPILER_CACHE: "off"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            # This leg's server build (CLI + bundled web client) is what
            # publish_cli ships to npm.
            cli-dist: true
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
          - label: Windows x64
            runner: ${{ vars.WINDOWS_X64_RUNNER || 'windows-2025' }}
            platform: win
            target: nsis
            arch: x64
          - label: Windows arm64
            runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          # The build reads only HEAD (for the embedded commit hash).
          fetch-depth: 1
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-ryco
        with:
          # Root tooling plus the workspaces the desktop artifact and CLI build
          # need. Skipping the rest (mobile) roughly halves the installed files,
          # which dominates install time on Windows.
          install-args: --filter=./ --filter=@ryco/desktop --filter=ryco-cli --filter=@ryco/web --filter=@ryco/scripts
          bun-cache: none
          restore-turbo-cache: "false"

      # The computer-use helper's pinned toolchain (its rust-toolchain.toml and
      # build-computer-use-helper.mjs). Also made the default, so no build step
      # picks up the runner image's floating stable.
      - name: Install computer-use Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $component = if ('${{ matrix.arch }}' -eq 'arm64') {
            'Microsoft.VisualStudio.Component.VC.Runtimes.ARM64.Spectre'
          } else {
            'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre'
          }
          $ready = & $vswhere -products * -latest -requires $component -property installationPath
          if (-not [string]::IsNullOrWhiteSpace($ready)) {
            Write-Host "Spectre libraries already installed: $component"
            exit 0
          }
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            Write-Error "Unable to resolve Visual Studio installation path via $vswhere; installPath='$installPath'"
            exit 1
          }

          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            $component, "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libsecret-1-dev

          pkg-config --modversion libsecret-1

          if command -v magick >/dev/null 2>&1; then
            magick -version
          else
            convert -version
          fi

      - name: Expose Windows SDK signtool
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found under Windows Kits\10\bin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $signtool.Directory.FullName
          "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "signtool.exe: $($signtool.FullName)"

      # Native helper builds (computer-use, cua, appsnap, ...) are content-keyed,
      # and the native build scripts revalidate every reused entry (key, sha256,
      # --hello handshake, cua provenance) and rebuild from source on any
      # mismatch. Seed that cache from the newest artifact of a release run on
      # main; a missing or rejected artifact, or a failing restore, only costs a
      # source build.
      - name: Restore native build cache
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RYCO_NATIVE_BUILD_CACHE_DIR: ${{ runner.temp }}/native-builds
        run: |
          echo "RYCO_NATIVE_BUILD_CACHE_DIR=$RYCO_NATIVE_BUILD_CACHE_DIR" >> "$GITHUB_ENV"
          artifacts="$RYCO_NATIVE_BUILD_CACHE_DIR/artifacts"
          node scripts/ci/native-cache.ts restore \
            --name "native-cache-${{ matrix.platform }}-${{ matrix.arch }}" \
            --dest "$artifacts"

          # Artifact zips do not keep file modes, and the computer-use entry is
          # validated by executing it (--hello), so a restored 0644 binary would
          # be rebuilt every time. Entries are checked by key and sha256 before
          # anything runs, and chmod leaves the mtimes prune relies on alone.
          if [[ "$RUNNER_OS" != Windows && -d "$artifacts" ]]; then
            find "$artifacts" -mindepth 3 -maxdepth 3 -type f \
              \( -name binary -o -name cua-driver \) -exec chmod 755 {} +
          fi

      - name: Build desktop artifact
        shell: bash
        env:
          # macOS Developer ID signing (secrets.CSC_LINK is the mac .p12). The
          # Windows self-sign branch below does not read these; it overrides
          # CSC_LINK / CSC_KEY_PASSWORD in-shell from WINDOWS_CERTIFICATE_BASE64.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.resolve.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (missing one or more Apple signing secrets)."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            elif has_all "$WINDOWS_CERTIFICATE_BASE64" "$WINDOWS_CERTIFICATE_PASSWORD"; then
              # electron-builder accepts a base64-encoded .pfx directly in
              # CSC_LINK, so no on-disk decode step is needed. It signs the
              # installer and inner binaries and regenerates the updater
              # blockmap from the signed artifacts.
              export CSC_LINK="$WINDOWS_CERTIFICATE_BASE64"
              export CSC_KEY_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"
              echo "Windows signing enabled (certificate from WINDOWS_CERTIFICATE_BASE64)."
              args+=(--signed)
            else
              echo "Windows signing disabled (no Azure Trusted Signing or WINDOWS_CERTIFICATE_BASE64 secrets)."
            fi
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          # Windows updater metadata is channel-specific (for example
          # "latest.yml" or "nightly.yml"). Suffix each per-arch copy so the
          # release job can merge matching arm64/x64 manifests back into one
          # canonical manifest per channel.
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            shopt -s nullglob
            for manifest in release-publish/*.yml; do
              mv "$manifest" "${manifest%.yml}-win-${{ matrix.arch }}.yml"
            done
          fi

      - name: Build Intel Mac resource monitor for CLI
        if: ${{ matrix.platform == 'mac' }}
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin --toolchain 1.95.0
          node scripts/build-resource-monitor.ts x64 darwin

      - name: Upload resource monitors for CLI
        uses: actions/upload-artifact@v7
        with:
          name: resource-monitor-${{ matrix.platform }}-${{ matrix.arch }}
          path: apps/server/dist/resource-monitor
          if-no-files-found: error

      # publish_cli ships this server build (with its bundled web client)
      # instead of repeating it: same build scripts, release version and runner
      # image. Tarred because artifact zips drop file modes (bin.mjs and the
      # bundled helper scripts are executable).
      - name: Pack CLI build
        if: ${{ matrix.cli-dist }}
        shell: bash
        run: tar -C apps/server -cf "$RUNNER_TEMP/cli-dist.tar" dist

      - name: Upload CLI build
        if: ${{ matrix.cli-dist }}
        uses: actions/upload-artifact@v7
        with:
          name: cli-dist
          path: ${{ runner.temp }}/cli-dist.tar
          if-no-files-found: error

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

      # Only release runs on main publish native caches; the restore side
      # accepts nothing else. A failed cache upload must not fail the release.
      - name: Prune unused native build cache entries
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        run: node scripts/ci/native-cache.ts prune --dir "$RYCO_NATIVE_BUILD_CACHE_DIR/artifacts"

      - name: Upload native build cache
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: native-cache-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.RYCO_NATIVE_BUILD_CACHE_DIR }}/artifacts
          retention-days: 90
          if-no-files-found: ignore

  publish_cli:
    name: Publish CLI to npm
    needs: [resolve, ci-status, verify, build]
    # Publishing requires verification: either verify passed, or it was skipped
    # because CI already passed on this exact commit. Defined once here and
    # reused by release_draft, so both publish paths share the same gate.
    if: &publish-gate >-
      ${{ !failure() && !cancelled()
        && needs.resolve.result == 'success'
        && needs.build.result == 'success'
        && (needs.verify.result == 'success'
          || (needs.verify.result == 'skipped' && needs.ci-status.outputs.reuse == 'true')) }}
    # npm trusted publishing requires GitHub-hosted runners so the OIDC runner
    # identity matches the package's trusted publisher configuration.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-ryco
        with:
          registry-url: https://registry.npmjs.org
          # Only cli.ts publish and the version script run here.
          install-args: --filter=ryco-cli --filter=@ryco/scripts
          install-resource-monitor-toolchain: "false"
          bun-cache: none
          restore-turbo-cache: "false"

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Download CLI build
        uses: actions/download-artifact@v8
        with:
          name: cli-dist
          path: ${{ runner.temp }}/cli-dist

      - name: Unpack CLI build
        shell: bash
        run: tar -C apps/server -xf "$RUNNER_TEMP/cli-dist/cli-dist.tar"

      - name: Download platform resource monitors
        uses: actions/download-artifact@v8
        with:
          pattern: resource-monitor-*
          path: apps/server/dist/resource-monitor
          merge-multiple: true

      - name: Restore resource monitor executable permissions
        shell: bash
        run: find apps/server/dist/resource-monitor -type f -name ryco-resource-monitor -exec chmod 755 {} +

      # The package smoke test inside `publish` fails if the bundled CLI reports
      # a different version than the one being published.
      - name: Publish CLI package
        run: node apps/server/scripts/cli.ts publish --tag "${{ needs.resolve.outputs.cli_dist_tag }}" --app-version "${{ needs.resolve.outputs.version }}" --provenance --verbose

  # Uploads the GitHub release as a draft while npm publishes. Drafts are
  # invisible to users, /releases/latest and electron-updater, so the release
  # still becomes public only after npm has the version (see release).
  release_draft:
    name: Draft GitHub Release
    needs: [resolve, ci-status, verify, build]
    # The verification gate defined on publish_cli.
    if: *publish-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id || steps.draft_first.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-ryco
        with:
          install-args: --filter=@ryco/scripts
          install-resource-monitor-toolchain: "false"
          bun-cache: none
          restore-turbo-cache: "false"

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Merge Windows updater manifests
        run: |
          shopt -s nullglob
          found_windows_manifest=false
          for x64_manifest in release-assets/*-win-x64.yml; do
            if [[ "$(basename "$x64_manifest")" == builder-debug-* ]]; then
              continue
            fi

            arm64_manifest="${x64_manifest/-x64.yml/-arm64.yml}"
            output_manifest="${x64_manifest/-win-x64.yml/.yml}"
            if [[ ! -f "$arm64_manifest" ]]; then
              echo "Missing matching arm64 Windows manifest for $x64_manifest" >&2
              exit 1
            fi

            found_windows_manifest=true
            node scripts/merge-update-manifests.ts --platform win \
              "$arm64_manifest" \
              "$x64_manifest" \
              "$output_manifest"
            rm -f "$arm64_manifest" "$x64_manifest"
          done

          if [[ "$found_windows_manifest" != true ]]; then
            echo "No Windows updater manifests found to merge." >&2
            exit 1
          fi

      - name: Prepare release notes body
        shell: bash
        run: |
          cat > release-assets/release-body.md <<'EOF'
          ## macOS unsigned install

          Ryco for macOS is currently unsigned and not notarized. Apple requires a paid Developer ID account for notarization, so macOS may say the app is damaged even when the GitHub download is valid.

          To install it, download the `.dmg`, open it, and run `Install Ryco.command`. The helper copies Ryco to `/Applications`, removes the quarantine flag from that installed app, and opens it.

          Manual fallback after dragging Ryco to `/Applications`:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Ryco.app
          open /Applications/Ryco.app
          ```
          EOF

      # A rerun, or an earlier failed run for the same version, leaves a draft
      # behind. The tag lookup API cannot see drafts, so list them, and replace
      # rather than duplicate them. A published release for the tag is never
      # touched.
      - name: Remove stale draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | "\(.id) \(.draft)"')"
          while read -r id draft; do
            [[ -n "$id" ]] || continue
            if [[ "$draft" != true ]]; then
              echo "::error::Release $id already publishes $RELEASE_TAG; refusing to replace it."
              exit 1
            fi
            echo "Deleting draft release $id for $RELEASE_TAG left by an earlier attempt."
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
          done <<< "$releases"

      # Latest is decided when the draft is published; drafts cannot be latest.
      - id: draft
        name: Create draft release
        if: needs.resolve.outputs.previous_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.ref }}
          name: ${{ needs.resolve.outputs.release_name }}
          body_path: release-assets/release-body.md
          generate_release_notes: true
          previous_tag: ${{ needs.resolve.outputs.previous_tag }}
          prerelease: ${{ needs.resolve.outputs.is_prerelease }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - id: draft_first
        name: Create first draft release
        if: needs.resolve.outputs.previous_tag == ''
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.ref }}
          name: ${{ needs.resolve.outputs.release_name }}
          body_path: release-assets/release-body.md
          generate_release_notes: true
          prerelease: ${{ needs.resolve.outputs.is_prerelease }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
          token: ${{ github.token }}

  release:
    name: Publish GitHub Release
    needs: [resolve, publish_cli, release_draft]
    if: ${{ !failure() && !cancelled() && needs.resolve.result == 'success' && needs.publish_cli.result == 'success' && needs.release_draft.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Publishing creates the tag at the draft's target commit.
      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.release_draft.outputs.release_id }}
          MAKE_LATEST: ${{ needs.resolve.outputs.make_latest }}
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_ID" ]]; then
            echo "::error::release_draft did not report a release id."
            exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest="$MAKE_LATEST" \
            --jq '"Published \(.html_url)"'

  finalize:
    name: Finalize release
    if: ${{ !failure() && !cancelled() && needs.resolve.result == 'success' && needs.release.result == 'success' && needs.resolve.outputs.release_channel == 'stable' }}
    needs: [resolve, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Pushes the version bump to main.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup project
        uses: ./.github/actions/setup-ryco
        with:
          install-args: --filter=@ryco/scripts
          install-resource-monitor-toolchain: "false"
          bun-cache: none
          restore-turbo-cache: "false"

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: bunx oxfmt@0.53.0 --config .github/oxfmtrc.release.json apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: bun install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json bun.lock; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json bun.lock
          git commit -m "chore(release): prepare $RELEASE_TAG"
          git push origin HEAD:main
