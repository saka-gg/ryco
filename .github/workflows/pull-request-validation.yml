name: Pull Request Validation

on:
  # Created by pr-vouch.yml after it has established that the PR author is
  # trusted. Repository-dispatch workflows execute from the default branch.
  repository_dispatch:
    types: [trusted-pr-validation]
  # Maintainers may deliberately validate an unvouched PR by its number.
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to validate manually.
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.event_name == 'workflow_dispatch' && github.event.inputs['pr-number'] || github.event.client_payload.pr }}
  cancel-in-progress: true

jobs:
  # repository_dispatch does not include pull_request data. Fetch one
  # authoritative PR record here for the trust decision and Turbo inputs.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checkout-ref: ${{ steps.gate.outputs.checkout-ref }}
      affected-base: ${{ steps.gate.outputs.affected-base }}
      should-validate: ${{ steps.gate.outputs.should-validate }}
    steps:
      - id: gate
        name: Check trust and validation scope
        uses: actions/github-script@v8
        with:
          script: |
            const canonicalRepository = "saka-gg/ryco";
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (repository !== canonicalRepository) {
              core.info(`Skipping validation outside ${canonicalRepository}: ${repository}`);
              core.setOutput("should-validate", "false");
              return;
            }

            const prNumber =
              context.eventName === "workflow_dispatch"
                ? Number(context.payload.inputs?.["pr-number"])
                : Number(context.payload.client_payload?.pr);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              throw new Error(`Invalid pull request number: ${prNumber}`);
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pullRequest.base.repo?.full_name !== canonicalRepository) {
              core.info(`Skipping PR #${prNumber}; base repository is ${pullRequest.base.repo?.full_name ?? "unknown"}.`);
              core.setOutput("should-validate", "false");
              return;
            }

            const labels = new Set(pullRequest.labels.map((label) => label.name));
            const trusted = labels.has("vouch:trusted");
            const denounced = labels.has("vouch:denounced");
            const manualApproval = context.eventName === "workflow_dispatch";
            if (denounced) {
              core.info(`Skipping PR #${prNumber}; author is denounced.`);
              core.setOutput("should-validate", "false");
              return;
            }
            if (!trusted && !manualApproval) {
              core.info(`Skipping PR #${prNumber}; repository dispatch requires vouch:trusted.`);
              core.setOutput("should-validate", "false");
              return;
            }

            core.info(
              manualApproval && !trusted
                ? `Validating PR #${prNumber} by manual approval.`
                : `Validating trusted PR #${prNumber}.`,
            );
            core.setOutput("checkout-ref", `refs/pull/${prNumber}/merge`);
            core.setOutput("affected-base", pullRequest.base.sha);
            core.setOutput("should-validate", "true");

  validate:
    name: Pull Request
    needs: gate
    if: ${{ needs.gate.outputs.should-validate == 'true' }}
    uses: ./.github/workflows/_validation.yml
    with:
      checkout-ref: ${{ needs.gate.outputs.checkout-ref }}
      affected-base: ${{ needs.gate.outputs.affected-base }}
      # The reusable workflow resolves paths from the checked-out merge commit,
      # after trust approval, using the same affected plan as the unit matrix.
      run-browser-tests: true
      run-desktop-build: true
      run-release-smoke: true
