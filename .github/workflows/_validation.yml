name: Reusable Validation

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Git ref to validate. Defaults to the event ref.
        required: false
        type: string
        default: ""
      run-browser-tests:
        description: Install Chromium and run browser tests.
        required: false
        type: boolean
        default: false
      run-desktop-build:
        description: Build the desktop pipeline and verify preload output.
        required: false
        type: boolean
        default: false
      run-release-smoke:
        description: Run release workflow smoke checks.
        required: false
        type: boolean
        default: false
      affected-base:
        description: >
          Git ref/SHA to diff against for Turbo `--affected` scoping. When set
          (PRs pass the base branch SHA), typecheck/test/build only run for
          packages the diff touches. Empty (the default) runs every package —
          the full-run backstop for main, branch-ci, and worktree validation.
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Feeds Turbo's `--affected` diff. Harmless when `--affected` isn't passed
# (empty affected-base ⇒ full run), so this can live at the workflow level.
env:
  TURBO_SCM_BASE: ${{ inputs['affected-base'] }}
  TURBO_SCM_HEAD: HEAD

# Each check runs as its own job so they execute in parallel instead of as one
# serial chain. Jobs share the Bun/Vite+ toolchain caches via setup-ryco, and
# each keeps its own Turbo cache slice (see `cache-scope`), so the redundant
# install/build work is cache-cheap. The long poles (the unit tests and the
# browser suite) are sharded across runners. The desktop build and release
# smoke stay gated behind their inputs so callers can skip them per path (see
# pull-request-validation.yml) or event.
#
# Cache handling convention for every job below: `setup-ryco` restores, and the
# job ends with an `if: always()` save. `actions/cache` normally registers its
# own post-job save, but that post step is skipped when the job fails, exactly
# the runs where the next attempt would benefit most from a warm cache. Failing
# jobs get retried; making them re-download and recompute from cold each time
# is the worst case, so saves are explicit and unconditional here.
jobs:
  static:
    name: Static
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs['checkout-ref'] != '' && inputs['checkout-ref'] || github.ref }}
          # Full history when scoping to affected packages so Turbo can compute
          # the merge-base against affected-base; shallow otherwise.
          fetch-depth: ${{ inputs['affected-base'] == '' && 1 || 0 }}
          persist-credentials: false

      - name: Setup project
        id: setup
        uses: ./.github/actions/setup-ryco
        with:
          cache-scope: static
          install-resource-monitor-toolchain: "false"

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      # fmt/lint stay repo-wide (fast); only typecheck scopes to affected.
      - name: Typecheck
        run: bun run typecheck ${{ inputs['affected-base'] != '' && '--affected' || '' }}

      - name: Save Turbo cache
        if: ${{ always() && steps.setup.outputs['turbo-cache-key'] != '' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs['turbo-cache-key'] }}

  # A dry plan owns affected-package selection. Each selected package can then
  # use explicit filters, and the server remains sharded in PR and full runs.
  test-matrix:
    name: Test matrix
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      include: ${{ steps.pick.outputs.include }}
      has-tests: ${{ steps.pick.outputs.has-tests }}
      # No `browser` output: the browser shards resolve the same scope in-job so
      # they can start without waiting here (see `browser` below).
      desktop: ${{ steps.pick.outputs.desktop }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs['checkout-ref'] != '' && inputs['checkout-ref'] || github.ref }}
          fetch-depth: ${{ inputs['affected-base'] == '' && 1 || 0 }}
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-ryco
        with:
          cache-scope: test-matrix
          install-resource-monitor-toolchain: "false"

      - id: pick
        name: Resolve test and validation scope
        run: bun scripts/ci/test-matrix.ts

  test:
    name: Test ${{ matrix.name }}
    needs: test-matrix
    if: ${{ needs.test-matrix.outputs.has-tests == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test-matrix.outputs.include) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs['checkout-ref'] != '' && inputs['checkout-ref'] || github.ref }}
          # Full history when scoping to affected packages so Turbo can diff
          # against affected-base; shallow otherwise.
          fetch-depth: ${{ inputs['affected-base'] == '' && 1 || 0 }}
          persist-credentials: false

      - name: Setup project
        id: setup
        uses: ./.github/actions/setup-ryco
        with:
          cache-scope: test-${{ matrix.name }}

      - name: Test
        run: bun run test ${{ matrix.filters }} -- ${{ matrix.shard }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.name }}
          path: |
            apps/**/test-results/*
            packages/**/test-results/*
            scripts/test-results/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize test timings
        if: always()
        run: bun scripts/ci/summarize-tests.ts

      - name: Save Turbo cache
        if: ${{ always() && steps.setup.outputs['turbo-cache-key'] != '' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs['turbo-cache-key'] }}

  build:
    name: Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs['checkout-ref'] != '' && inputs['checkout-ref'] || github.ref }}
          fetch-depth: ${{ inputs['affected-base'] == '' && 1 || 0 }}
          persist-credentials: false

      - name: Setup project
        id: setup
        uses: ./.github/actions/setup-ryco
        with:
          cache-scope: build

      - name: Build
        run: bun run build ${{ inputs['affected-base'] != '' && '--affected' || '' }}

      - name: Save Turbo cache
        if: ${{ always() && steps.setup.outputs['turbo-cache-key'] != '' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs['turbo-cache-key'] }}

  # `vitest.browser.config.ts` sets `fileParallelism: false` on purpose:
  # interaction tests share one constrained Chromium and go flaky when they
  # race. That keeps a single runner at roughly 15% CPU for the whole suite, so
  # the way to spend the idle capacity is more runners, not a bigger one. Each
  # shard stays internally serial, preserving the timing invariant.
  #
  # These shards are the wall-clock long pole, so they do not wait for the
  # test-matrix job. Each shard resolves the same validation scope itself right
  # after setup and skips its remaining steps when browser tests are not
  # required. A skipped shard costs about 40 seconds of runner time; waiting on
  # the matrix would cost that on every run where the suite is needed.
  browser:
    name: Browser tests ${{ matrix.shard }}
    if: ${{ inputs['run-browser-tests'] }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs['checkout-ref'] != '' && inputs['checkout-ref'] || github.ref }}
          # Full history when scoping so the in-job scope resolution can diff
          # against affected-base; shallow otherwise.
          fetch-depth: ${{ inputs['affected-base'] == '' && 1 || 0 }}
          persist-credentials: false

      - name: Setup project
        id: setup
        uses: ./.github/actions/setup-ryco
        with:
          cache-scope: browser-${{ matrix.shard }}
          install-resource-monitor-toolchain: "false"

      - id: scope
        name: Resolve validation scope
        run: bun scripts/ci/test-matrix.ts

      # No build step and no Turbo save: browser tests run Vitest directly, which
      # serves the app through the Vite dev server, and every `@ryco/*` workspace
      # export web uses resolves to `src` under the ESM `import` condition. So
      # neither the `@ryco/web` bundle nor any dependency's `dist/` is read.
      - name: Restore Playwright browsers
        if: ${{ steps.scope.outputs.browser == 'true' }}
        id: playwright-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install browser test runtime
        if: ${{ steps.scope.outputs.browser == 'true' }}
        run: bun run --cwd apps/web test:browser:install

      # Saved before the suite runs, and only on a cold key. The browser
      # download is already complete here and is independent of the test
      # outcome, so there is no reason to make a red suite re-download Chromium
      # on the next attempt.
      - name: Save Playwright browsers
        if: ${{ steps.scope.outputs.browser == 'true' && steps.playwright-cache.outputs['cache-hit'] != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Browser test
        if: ${{ steps.scope.outputs.browser == 'true' }}
        run: bun run --cwd apps/web test:browser --shard ${{ matrix.shard }}

      - name: Upload browser test reports
        if: ${{ always() && steps.scope.outputs.browser == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results-${{ strategy.job-index }}
          path: |
            apps/web/test-results/*
            apps/web/src/**/__screenshots__/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize browser test timings
        if: ${{ always() && steps.scope.outputs.browser == 'true' }}
        run: bun scripts/ci/summarize-tests.ts

  desktop:
    name: Desktop build
    needs: test-matrix
    if: ${{ inputs['run-desktop-build'] && needs.test-matrix.outputs.desktop == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs['checkout-ref'] != '' && inputs['checkout-ref'] || github.ref }}
          persist-credentials: false

      - name: Setup project
        id: setup
        uses: ./.github/actions/setup-ryco
        with:
          cache-scope: desktop

      - name: Install computer-use Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

      - name: Save Turbo cache
        if: ${{ always() && steps.setup.outputs['turbo-cache-key'] != '' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs['turbo-cache-key'] }}

  release-smoke:
    name: Release Smoke
    needs: test-matrix
    if: ${{ inputs['run-release-smoke'] && needs.test-matrix.outputs.release == 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs['checkout-ref'] != '' && inputs['checkout-ref'] || github.ref }}
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup-ryco
        with:
          cache-scope: release-smoke
          install-resource-monitor-toolchain: "false"

      # No Turbo save: this job runs no Turbo task, so it has nothing to
      # contribute to the cache.
      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
