<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ryco — Tasks as a checklist</title>
<style>
:root{--c-bg:var(--background,#0b0b0c);--c-fg:var(--foreground,#ececed);--c-muted-fg:var(--muted-foreground,#a3a3aa);--c-card:var(--card,#151516);--c-popover:var(--popover,#1b1b1d);--c-border:var(--border,rgba(255,255,255,0.09));--c-muted:var(--muted,rgba(255,255,255,0.06));--c-accent:var(--accent,rgba(255,255,255,0.09));--c-primary:var(--primary,#e4e4e5);--c-primary-fg:var(--primary-foreground,#0b0b0c);--c-success:var(--success,#10b981);--c-warning:var(--warning,#f59e0b);--c-info:var(--info,#3b82f6);--c-sans:var(--font-sans,"DM Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif);--c-mono:var(--font-mono,"SF Mono",ui-monospace,Menlo,monospace);--c-faint:color-mix(in srgb,var(--c-muted-fg) 70%,transparent);--ease:cubic-bezier(0.16,1,0.3,1);--snappy:cubic-bezier(0.3,1.36,0.44,1);--shadow-lg:0 24px 60px -20px rgba(0,0,0,0.6),0 2px 10px rgba(0,0,0,0.28);}
html.standalone{background:var(--c-bg);}
html.standalone body{padding:24px;}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--c-sans);font-size:13px;color:var(--c-fg);-webkit-font-smoothing:antialiased;}
button,input,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
svg.i{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.page{position:relative;max-width:680px;padding-right:40px;min-height:600px;}
.head{display:flex;align-items:baseline;gap:10px;margin:4px 0 14px;}
.head h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-0.02em;}
.head .n{color:var(--c-faint);font-size:13px;}
.head .proj{margin-left:auto;display:flex;gap:2px;}
.head .proj button{border:0;background:transparent;color:var(--c-faint);font-size:12px;padding:3px 7px;border-radius:6px;}
.head .proj button:hover{color:var(--c-fg);}
.head .proj button[aria-pressed="true"]{color:var(--c-fg);background:var(--c-muted);}
.add{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--c-faint);transition:background 160ms var(--ease);}
.add:focus-within{background:var(--c-muted);}
.add input{flex:1;border:0;outline:0;background:transparent;font-size:14px;color:var(--c-fg);}
.add input::placeholder{color:var(--c-faint);}
.add .chips{display:flex;gap:4px;}
.plus{width:18px;height:18px;display:grid;place-items:center;flex:none;}
.rows{display:flex;flex-direction:column;}
.rows[hidden]{display:none;}
.row{border-radius:10px;transition:background 160ms var(--ease);}
.row:hover,.row.open{background:color-mix(in srgb,var(--c-fg) 3.5%,transparent);}
.line{display:flex;align-items:center;gap:12px;padding:9px 10px;cursor:pointer;min-height:40px;}
.box{width:18px;height:18px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c-fg) 32%,transparent);flex:none;display:grid;place-items:center;background:transparent;padding:0;transition:background 160ms var(--ease),border-color 160ms var(--ease),transform 160ms var(--snappy);}
.box:hover{border-color:var(--c-fg);}
.box:active{transform:scale(0.85);}
.box svg{width:11px;height:11px;stroke:var(--c-bg);stroke-width:3.2;opacity:0;transform:scale(0.5);transition:opacity 140ms var(--ease),transform 220ms var(--snappy);}
.row.done .box{background:var(--c-success);border-color:var(--c-success);}
.row.done .box svg{opacity:1;transform:none;}
.title{flex:1;min-width:0;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color 200ms var(--ease);}
.row.done .title{color:var(--c-faint);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c-faint) 60%,transparent);}
.meta{display:flex;align-items:center;gap:10px;color:var(--c-faint);font-size:12px;white-space:nowrap;}
.meta .m{display:inline-flex;align-items:center;gap:4px;}
.meta .soon{color:color-mix(in srgb,var(--c-warning) 80%,var(--c-fg));}
.pd{width:8px;height:8px;border-radius:3px;flex:none;}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--c-muted-fg);}
.st .d{width:7px;height:7px;border-radius:50%;}
.st.working .d{background:var(--c-info);animation:pulse 1.6s var(--ease) infinite;}
.st.starting .d{background:transparent;border:1.5px solid var(--c-info);border-right-color:transparent;width:9px;height:9px;animation:spin 800ms linear infinite;}
.st.needs{color:color-mix(in srgb,var(--c-warning) 80%,var(--c-fg));}
.st.needs .d{background:var(--c-warning);}
.st.review{color:color-mix(in srgb,var(--c-success) 80%,var(--c-fg));}
.st.review .d{background:var(--c-success);}
.go{opacity:0;border:0;background:transparent;color:var(--c-muted-fg);display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 7px;border-radius:6px;transition:opacity 140ms var(--ease),background 140ms var(--ease);}
.line:hover .go{opacity:1;}
.go:hover{background:var(--c-accent);color:var(--c-fg);}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows 320ms var(--ease);}
.row.open .more{grid-template-rows:1fr;}
.more>div{overflow:hidden;}
.inner{padding:0 12px 12px 40px;display:flex;flex-direction:column;gap:10px;}
.notes{width:100%;border:0;outline:0;background:transparent;resize:none;font-size:13px;line-height:1.55;color:var(--c-muted-fg);padding:0;field-sizing:content;min-height:22px;}
.notes:focus{color:var(--c-fg);}
.notes::placeholder{color:var(--c-faint);}
.props{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;border:1px solid var(--c-border);background:transparent;font-size:12px;color:var(--c-muted-fg);white-space:nowrap;transition:background 140ms var(--ease),color 140ms var(--ease);}
.chip:hover{background:var(--c-muted);color:var(--c-fg);}
.chip.ghost{border-style:dashed;color:var(--c-faint);}
.chip svg.i{width:12px;height:12px;}
.chats{display:flex;flex-direction:column;gap:2px;}
.chat{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 8px;margin:0 -8px;border-radius:7px;cursor:pointer;}
.chat:hover{background:var(--c-muted);}
.chat .br{font-family:var(--c-mono);font-size:11.5px;color:var(--c-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat .open{margin-left:auto;color:var(--c-faint);font-size:12px;}
.foot{display:flex;align-items:center;gap:8px;}
.split{display:inline-flex;border-radius:8px;overflow:hidden;}
.split button{border:0;height:28px;background:var(--c-primary);color:var(--c-primary-fg);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:0 11px;}
.split button+button{padding:0 7px;border-left:1px solid color-mix(in srgb,var(--c-primary-fg) 18%,transparent);}
.split button:hover{opacity:.9;}
.where{font-size:12px;color:var(--c-faint);}
.where b{font-weight:500;color:var(--c-muted-fg);font-family:var(--c-mono);font-size:11.5px;}
.del{margin-left:auto;border:0;background:transparent;color:var(--c-faint);font-size:12px;padding:4px 6px;border-radius:6px;}
.del:hover{color:var(--c-fg);background:var(--c-muted);}
.group{display:flex;align-items:center;gap:6px;margin:14px 0 2px;padding:4px 10px;border:0;background:transparent;color:var(--c-faint);font-size:12px;}
.group:hover{color:var(--c-fg);}
.group svg{transition:transform 220ms var(--ease);}
.group[aria-expanded="true"] svg{transform:rotate(90deg);}
.menu{position:absolute;z-index:9;min-width:250px;padding:4px;border-radius:10px;background:var(--c-popover);border:1px solid var(--c-border);box-shadow:var(--shadow-lg);animation:pop 180ms var(--ease);}
.menu button{display:flex;align-items:flex-start;gap:9px;width:100%;padding:7px 8px;border:0;border-radius:6px;background:transparent;font-size:12.5px;text-align:left;}
.menu button:hover{background:var(--c-accent);}
.menu small{display:block;color:var(--c-faint);font-size:11.5px;margin-top:1px;}
.menu svg.i{margin-top:2px;}
.toast{position:absolute;left:50%;bottom:6px;transform:translate(-50%,14px);opacity:0;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--c-popover);border:1px solid var(--c-border);box-shadow:var(--shadow-lg);font-size:12.5px;pointer-events:none;transition:opacity 200ms var(--ease),transform 260ms var(--snappy);z-index:10;white-space:nowrap;}
.toast.on{opacity:1;transform:translate(-50%,0);}
.enter{animation:enter 360ms var(--snappy) both;}
@keyframes enter{from{opacity:0;transform:translateY(-6px);}}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(0.97);}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c-info) 55%,transparent);}70%,100%{box-shadow:0 0 0 5px transparent;}}
@keyframes spin{to{transform:rotate(360deg);}}
@media (max-width:560px){.meta .m.pj{display:none;}.page{padding-right:0;}}
</style>
</head>
<body>
<div class="page" id="page">
<div class="head"><h1>Tasks</h1><span class="n" id="count"></span><div class="proj" id="proj"></div></div>
<label class="add"><span class="plus"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></span><input id="add" placeholder="Add a task…" autocomplete="off" /><span class="chips" id="addChips"></span></label>
<div class="rows" id="open"></div>
<button class="group" id="doneToggle" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="m9 18 6-6-6-6"/></svg><span id="doneLabel"></span></button>
<div class="rows" id="done" hidden></div>
<div class="toast" id="toast"></div>
</div>
<script>
(() => {
if (!getComputedStyle(document.documentElement).getPropertyValue("--background").trim()) document.documentElement.classList.add("standalone");
const P = {
check: '<path d="M20 6 9 17l-5-5"/>',
play: '<polygon points="6 3 20 12 6 21 6 3"/>',
down: '<path d="m6 9 6 6 6-6"/>',
cal: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
branch: '<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
pr: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/>',
issue: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/>',
clip: '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
fork: '<circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9M12 12v3"/>',
laptop: '<rect width="18" height="12" x="3" y="4" rx="2"/><path d="M2 20h20"/>',
chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const PROJECTS = { ryco: ["ryco", "#6366f1"], inspect: ["cs2inspect-web", "#0ea5e9"], paints: ["weaponpaints", "#f97316"] };
const today = new Date(2026, 9, 18);
const day = 86400000;
const inDays = (n) => new Date(today.getTime() + n * day);
let seq = 0;
const tasks = [
{ title: "Fix login redirect loop on hosted Hub", notes: "After the session cookie expires, /pair redirects to / and back to /pair. Repro: let the session expire in a hosted tab, then reload.", project: "ryco", due: inDays(2), links: [["issue", "#231"]], files: ["loop.png"], chats: [] },
{ title: "Upgrade Effect to 4.1 in the server", notes: "Bump effect + @effect/* together.", project: "ryco", due: null, links: [], files: [], chats: [{ model: "Opus 5.5", status: "needs", branch: "task/effect-4-1" }] },
{ title: "Migrate weapon paints store to Pinia", notes: "", project: "paints", due: null, links: [], files: [], chats: [{ model: "GPT-5.6", status: "working", branch: "task/pinia-store" }] },
{ title: "Translucent window: tune blur radius", notes: "Match Synara: 90% coat, raised panes 55% / 31%.", project: "ryco", due: null, links: [["pr", "#746"]], files: ["synara-ref.png"], chats: [{ model: "Opus 5.5", status: "review", branch: "task/translucent-blur" }] },
{ title: "Float range filter in skin search", notes: "Two-thumb slider, persisted in the URL.", project: "inspect", due: inDays(6), links: [], files: [], chats: [] },
{ title: "Idea: per-subscription usage in the composer", notes: "", project: "ryco", due: null, links: [], files: [], chats: [] },
{ title: "Renew Apple developer certificate", notes: "Needed for the notarized desktop build.", project: null, due: inDays(1), links: [], files: [], chats: [] },
{ title: "Simplify chat header breadcrumbs", notes: "", project: "ryco", due: null, links: [["pr", "#745"]], files: [], chats: [], done: true },
{ title: "Check Steam inspect-link rate limits", notes: "", project: "inspect", due: null, links: [], files: [], chats: [], done: true },
].map((t) => ({ id: `t${++seq}`, done: false, ...t }));
const state = { open: null, project: "all", showDone: false };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const STOP = new Set(["a", "an", "the", "on", "in", "to", "for", "of", "idea", "when", "is"]);
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").split("-").filter((w) => w && !STOP.has(w)).slice(0, 4).join("-");
const dueText = (d) => {
const n = Math.round((d - today) / day);
if (n <= 0) return ["Today", "soon"];
if (n === 1) return ["Tomorrow", "soon"];
if (n < 7) return [d.toLocaleDateString("en", { weekday: "short" }), n <= 2 ? "soon" : ""];
return [d.toLocaleDateString("en", { month: "short", day: "numeric" }), ""];
};
const STATUS = { starting: "Starting", working: "Working", needs: "Needs you", review: "Ready to review" };
const status = (t) => {
const order = ["needs", "starting", "working", "review"];
for (const s of order) if (t.chats.some((c) => c.status === s)) return s;
return null;
};
const where = (t) => {
const pr = t.links.find((l) => l[0] === "pr");
const n = t.chats.length ? `-${t.chats.length + 1}` : "";
return pr ? { kind: "pr", label: `PR ${pr[1]}`, branch: `pr-${pr[1].slice(1)}` } : { kind: "new", label: "New worktree", branch: `task/${slug(t.title)}${n}` };
};
const rowHtml = (t, enter) => {
const s = status(t);
const meta = [];
if (s && !t.done) meta.push(`<span class="st ${s}"><span class="d"></span>${STATUS[s]}</span>`);
for (const [k, v] of t.links) meta.push(`<span class="m">${ic(k)}${esc(v)}</span>`);
if (t.files.length) meta.push(`<span class="m">${ic("clip")}${t.files.length}</span>`);
if (t.due && !t.done) { const [txt, cls] = dueText(t.due); meta.push(`<span class="m ${cls}">${txt}</span>`); }
if (t.project) meta.push(`<span class="m pj"><span class="pd" style="background:${PROJECTS[t.project][1]}"></span>${PROJECTS[t.project][0]}</span>`);
const go = !s && !t.done ? `<button class="go" data-start="${t.id}" title="Start a chat in a new worktree">${ic("play")}Start</button>` : "";
const w = where(t);
const chats = t.chats.map((c) => `<div class="chat" data-openchat><span class="st ${c.status}"><span class="d"></span></span>${esc(c.model)} <span style="color:var(--c-muted-fg)">· ${STATUS[c.status]}</span><span class="br">${esc(c.branch)}</span><span class="open">Open chat →</span></div>`).join("");
return `<div class="row${t.done ? " done" : ""}${state.open === t.id ? " open" : ""}${enter ? " enter" : ""}" data-id="${t.id}">
<div class="line"><button class="box" data-toggle="${t.id}" aria-label="Done">${`<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">${P.check}</svg>`}</button><span class="title">${esc(t.title)}</span>${go}<span class="meta">${meta.join("")}</span></div>
<div class="more"><div><div class="inner">
<textarea class="notes" data-notes="${t.id}" rows="1" placeholder="Notes, context, what done looks like…">${esc(t.notes)}</textarea>
<div class="props">
<button class="chip" data-proj-pick="${t.id}">${t.project ? `<span class="pd" style="background:${PROJECTS[t.project][1]}"></span>${PROJECTS[t.project][0]}` : "No project"}</button>
${t.due ? `<button class="chip">${ic("cal")}${dueText(t.due)[0]}</button>` : `<button class="chip ghost" data-due="${t.id}">${ic("cal")}Due date</button>`}
${t.links.map(([k, v]) => `<button class="chip">${ic(k)}${esc(v)}</button>`).join("")}
${t.files.map((f) => `<button class="chip">${ic("clip")}${esc(f)}</button>`).join("")}
<button class="chip ghost" data-link="${t.id}">${ic("link")}Link</button>
<button class="chip ghost" data-file="${t.id}">${ic("clip")}File</button>
</div>
${chats ? `<div class="chats">${chats}</div>` : ""}
${t.done ? "" : `<div class="foot"><span class="split"><button data-start="${t.id}">${ic("play")}${t.chats.length ? "Another chat" : "Start chat"}</button><button data-where-menu="${t.id}" aria-label="Where">${ic("down")}</button></span><span class="where">in ${w.kind === "pr" ? "the" : "a"} ${w.kind === "pr" ? `${w.label} worktree` : "new worktree"} · <b>${esc(w.branch)}</b></span><button class="del" data-del="${t.id}">Delete</button></div>`}
</div></div></div></div>`;
};
const visible = (t) => state.project === "all" || t.project === state.project;
const render = (enter = []) => {
const ae = document.activeElement;
const keep = ae?.dataset?.notes ? { id: ae.dataset.notes, a: ae.selectionStart, b: ae.selectionEnd } : null;
const open = tasks.filter((t) => !t.done && visible(t));
const done = tasks.filter((t) => t.done && visible(t));
$("#open").innerHTML = open.map((t) => rowHtml(t, enter.includes(t.id))).join("");
$("#done").innerHTML = done.map((t) => rowHtml(t)).join("");
$("#count").textContent = `${open.length} open`;
$("#doneLabel").textContent = `Completed · ${done.length}`;
$("#doneToggle").setAttribute("aria-expanded", String(state.showDone));
$("#done").hidden = !state.showDone;
if (keep) { const el = document.querySelector(`[data-notes="${keep.id}"]`); if (el) { el.focus(); el.setSelectionRange(keep.a, keep.b); } }
$("#proj").innerHTML = [["all", "All"], ...Object.entries(PROJECTS).map(([k, v]) => [k, v[0]])].map(([k, l]) => `<button data-p="${k}" aria-pressed="${state.project === k}">${l}</button>`).join("");
};
let tt;
const toast = (h) => { const el = $("#toast"); el.innerHTML = h; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2400); };
const byId = (id) => tasks.find((t) => t.id === id);
const setOpen = (id) => {
const prev = state.open;
state.open = prev === id ? null : id;
document.querySelectorAll(".row").forEach((r) => r.classList.toggle("open", r.dataset.id === state.open));
};
const start = (t, kind) => {
const w = where(t);
const branch = kind === "local" ? "main" : kind === w.kind ? w.branch : `task/${slug(t.title)}${t.chats.length ? `-${t.chats.length + 1}` : ""}`;
const c = { model: "Opus 5.5", status: "starting", branch };
t.chats.push(c);
render();
toast(`${ic("play")} Chat started ${kind === "local" ? "in the project folder" : `in worktree ${esc(branch)}`} · it keeps running in the background`);
setTimeout(() => { c.status = "working"; render(); }, 1400);
setTimeout(() => { c.status = "review"; render(); }, 6000);
};
const DAYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const parse = (raw) => {
let s = raw, project = null, due = null;
s = s.replace(/(^|\s)#([\w-]+)/g, (m, a, p) => { const k = Object.keys(PROJECTS).find((k) => k === p.toLowerCase() || PROJECTS[k][0].startsWith(p.toLowerCase())); if (!k) return m; project = k; return a; });
s = s.replace(/(^|\s)(?:due:|@)(today|tomorrow|mon|tue|wed|thu|fri|sat|sun)\b/gi, (m, a, d) => { d = d.toLowerCase(); let n = d === "today" ? 0 : d === "tomorrow" ? 1 : (DAYS.indexOf(d) - today.getDay() + 7) % 7 || 7; due = inDays(n); return a; });
return { title: s.replace(/\s+/g, " ").trim(), project, due };
};
const add = $("#add");
add.addEventListener("input", () => {
const p = parse(add.value);
$("#addChips").innerHTML = [p.project && `<span class="chip"><span class="pd" style="background:${PROJECTS[p.project][1]}"></span>${PROJECTS[p.project][0]}</span>`, p.due && `<span class="chip">${ic("cal")}${dueText(p.due)[0]}</span>`].filter(Boolean).join("");
});
add.addEventListener("focus", () => { add.placeholder = "Add a task…   #project  due:fri"; });
add.addEventListener("blur", () => { add.placeholder = "Add a task…"; });
add.addEventListener("keydown", (e) => {
if (e.key !== "Enter") return;
const p = parse(add.value);
if (!p.title) return;
const t = { id: `t${++seq}`, title: p.title, notes: "", project: p.project ?? (state.project === "all" ? null : state.project), due: p.due, links: [], files: [], chats: [], done: false };
tasks.unshift(t);
add.value = "";
$("#addChips").innerHTML = "";
render([t.id]);
if (e.metaKey || e.ctrlKey) start(t, "new");
});
add.addEventListener("paste", (e) => {
const text = e.clipboardData.getData("text");
const lines = text.split("\n").map((l) => l.replace(/^\s*[-*•]\s*|^\s*\d+[.)]\s*/, "").trim()).filter(Boolean);
if (lines.length < 2) return;
e.preventDefault();
const ids = lines.map((l) => { const p = parse(l); const t = { id: `t${++seq}`, title: p.title, notes: "", project: p.project, due: p.due, links: [], files: [], chats: [], done: false }; tasks.unshift(t); return t.id; });
render(ids);
toast(`${lines.length} tasks added`);
});
let menu = null;
const closeMenu = () => { menu?.remove(); menu = null; };
const openMenu = (anchor, items, pick) => {
closeMenu();
const pr = $("#page").getBoundingClientRect(), r = anchor.getBoundingClientRect();
menu = document.createElement("div");
menu.className = "menu";
menu.innerHTML = items.map(([id, icon, label, sub]) => `<button data-pick="${id}">${ic(icon)}<span>${label}${sub ? `<small>${sub}</small>` : ""}</span></button>`).join("");
$("#page").appendChild(menu);
menu.style.left = Math.min(r.left - pr.left, pr.width - menu.offsetWidth - 4) + "px";
menu.style.top = r.bottom - pr.top + 4 + "px";
menu.addEventListener("click", (e) => { const b = e.target.closest("[data-pick]"); if (!b) return; e.stopPropagation(); const id = b.dataset.pick; closeMenu(); pick(id); });
};
document.addEventListener("input", (e) => { const n = e.target.closest("[data-notes]"); if (n) byId(n.dataset.notes).notes = n.value; });
document.addEventListener("click", (e) => {
const el = e.target;
if (menu && !el.closest(".menu")) closeMenu();
const p = el.closest("[data-p]");
if (p) { state.project = p.dataset.p; return render(); }
if (el.closest("#doneToggle")) { state.showDone = !state.showDone; return render(); }
const tg = el.closest("[data-toggle]");
if (tg) {
const t = byId(tg.dataset.toggle);
const row = tg.closest(".row");
row.classList.toggle("done", !t.done);
t.done = !t.done;
if (t.done) toast(`${ic("check")} Done${t.chats.length ? " · its chats stay in the sidebar" : ""}`);
setTimeout(() => { if (state.open === t.id) state.open = null; render(); }, 420);
return;
}
const st = el.closest("[data-start]");
if (st) { const t = byId(st.dataset.start); return start(t, where(t).kind); }
const wm = el.closest("[data-where-menu]");
if (wm) {
const t = byId(wm.dataset.whereMenu), w = where(t);
const items = [["new", "fork", "New worktree", `${w.kind === "new" ? w.branch : `task/${slug(t.title)}`} from main`]];
if (w.kind === "pr") items.unshift(["pr", "pr", `${w.label} worktree`, "Pushes update the pull request"]);
items.push(["local", "laptop", "Project folder", "No worktree, current branch"]);
return openMenu(wm, items, (k) => start(t, k));
}
const lk = el.closest("[data-link]");
if (lk) {
const t = byId(lk.dataset.link);
return openMenu(lk, [["pr", "pr", "Pull request", "Paste a URL or #number"], ["issue", "issue", "Issue", "GitHub issue or Jira key"], ["branch", "branch", "Branch", "Start chats on it"], ["chat", "chat", "Existing chat", "Attach a chat you already had"]], (k) => {
const v = { pr: "#752", issue: "#240", branch: "feature/x", chat: "Hub reconnect investigation" }[k];
t.links.push([k, v]);
render();
});
}
const fl = el.closest("[data-file]");
if (fl) { byId(fl.dataset.file).files.push("screenshot.png"); return render(); }
const du = el.closest("[data-due]");
if (du) { byId(du.dataset.due).due = inDays(5); return render(); }
const pp = el.closest("[data-proj-pick]");
if (pp) { const t = byId(pp.dataset.projPick); return openMenu(pp, Object.entries(PROJECTS).map(([k, v]) => [k, "laptop", v[0], ""]), (k) => { t.project = k; render(); }); }
const dl = el.closest("[data-del]");
if (dl) { tasks.splice(tasks.findIndex((t) => t.id === dl.dataset.del), 1); state.open = null; toast("Task deleted · its chats are kept"); return render(); }
if (el.closest("[data-openchat]")) return toast(`${ic("chat")} Would open the chat`);
if (el.closest(".more")) return;
const line = el.closest(".line");
if (line) setOpen(line.parentElement.dataset.id);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenu(); if (state.open) setOpen(state.open); } });
render();
})();
</script>
</body>
</html>
