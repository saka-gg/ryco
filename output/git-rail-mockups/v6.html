<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root {
--isl-bg: #0d0d0e;
--isl-border: rgba(255, 255, 255, 0.08);
--isl-fg: #f4f4f5;
--isl-muted: #a1a1aa;
--isl-faint: #6b6b73;
--ok: #22c55e;
--ok-fg: #4ade80;
--bad: #ef4444;
--bad-fg: #f87171;
--warn: #f59e0b;
--warn-fg: #fbbf24;
--inf: #3b82f6;
--inf-fg: #60a5fa;
--merged: #c084fc;
--plan: #a78bfa;
--agent: #38bdf8;
--note: #eccb6b;
--ease-out: cubic-bezier(0.16, 1, 0.3, 1);
--ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
--sans: var(--font-sans, "Inter", system-ui, sans-serif);
--mono: var(--font-mono, "SF Mono", ui-monospace, Menlo, monospace);
}
* {
box-sizing: border-box;
}
body {
margin: 0;
font-family: var(--sans);
}
button {
font-family: inherit;
}

.wrap {
display: flex;
flex-direction: column;
gap: 10px;
}
.bar {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: 6px;
}
.bar .tag {
font: 600 11px/1 var(--sans);
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--muted-foreground);
margin-right: 6px;
}
.seg {
font: 500 12px/1 var(--sans);
padding: 7px 11px;
border-radius: 999px;
border: 1px solid var(--border);
background: transparent;
color: var(--foreground);
cursor: pointer;
transition: background 0.15s, color 0.15s;
}
.seg:hover {
background: var(--accent);
}
.seg[aria-pressed="true"] {
background: var(--foreground);
color: var(--background);
border-color: transparent;
}
.hint {
font-size: 11.5px;
color: var(--muted-foreground);
}

.stage {
position: relative;
height: 560px;
border-radius: var(--radius, 12px);
background: var(--card);
border: 1px solid var(--border);
overflow: hidden;
}
.chat {
position: absolute;
left: 20px;
top: 20px;
bottom: 20px;
right: 92px;
display: flex;
flex-direction: column;
gap: 14px;
font-size: 13px;
line-height: 1.55;
color: var(--foreground);
}
.chat .u {
align-self: flex-end;
max-width: 78%;
padding: 8px 12px;
border-radius: 16px;
background: var(--secondary);
color: var(--secondary-foreground);
}
.chat .a {
color: var(--muted-foreground);
max-width: 92%;
}
.chat .a b {
color: var(--foreground);
font-weight: 600;
}
.chat .tool {
display: inline-flex;
gap: 6px;
align-items: center;
font: 500 11.5px var(--mono);
color: var(--muted-foreground);
padding: 4px 8px;
border-radius: 8px;
background: var(--muted);
align-self: flex-start;
}
.composer {
margin-top: auto;
height: 84px;
border-radius: 18px;
background: var(--muted);
padding: 12px 14px;
font-size: 13px;
color: var(--muted-foreground);
}

.crown {
position: absolute;
top: 14px;
right: 14px;
width: 48px;
color: var(--isl-fg);
font-size: 12px;
line-height: 1.45;
}
.ic {
width: 16px;
height: 16px;
flex: none;
}
.ic.sm {
width: 14px;
height: 14px;
}
.ic.xs {
width: 12px;
height: 12px;
}
.mono {
font-family: var(--mono);
}
.trunc {
min-width: 0;
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}
.spin {
animation: spin 0.8s linear infinite;
}
@keyframes spin {
to {
transform: rotate(360deg);
}
}

.island {
position: absolute;
top: 0;
right: 0;
z-index: 6;
width: 48px;
height: 48px;
border-radius: 24px;
background: var(--isl-bg);
border: 1px solid var(--isl-border);
overflow: hidden;
box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
transition:
width 0.55s var(--ease-spring),
box-shadow 0.4s ease;
}
.island[data-mode="alert"] {
width: 272px;
box-shadow:
0 0 0 1px color-mix(in srgb, var(--tone) 50%, transparent),
0 12px 34px -8px color-mix(in srgb, var(--tone) 45%, transparent);
}
.face {
position: absolute;
top: 0;
right: 0;
width: 46px;
height: 46px;
display: grid;
place-items: center;
}
.logo {
width: 22px;
height: 22px;
border-radius: 7px;
display: grid;
place-items: center;
background: linear-gradient(140deg, #3f3f46, #18181b);
box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
font: 700 11px/1 var(--sans);
color: #fff;
}
.al {
position: absolute;
left: 16px;
right: 50px;
top: 0;
bottom: 0;
display: flex;
align-items: center;
gap: 10px;
opacity: 0;
transition: opacity 0.18s;
}
.island[data-mode="alert"] .al {
opacity: 1;
transition-delay: 0.14s;
}
.al-ic {
color: var(--tone);
display: grid;
}
.al b {
display: block;
font-size: 12.5px;
font-weight: 600;
}
.al small {
display: block;
font-size: 11px;
color: var(--isl-muted);
}

.rail {
position: relative;
margin-top: 56px;
width: 48px;
border-radius: 24px;
background: var(--isl-bg);
border: 1px solid var(--isl-border);
box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
}
.rail-list {
position: relative;
display: flex;
flex-direction: column;
align-items: center;
gap: 5px;
padding: 5px;
}
.hl {
position: absolute;
top: 0;
left: 0;
width: 36px;
height: 36px;
border-radius: 50%;
background: rgba(255, 255, 255, 0.11);
pointer-events: none;
opacity: 0;
transition:
transform 0.42s var(--ease-spring),
opacity 0.2s,
width 0.2s,
height 0.2s;
}
.sep {
flex: none;
width: 20px;
height: 1px;
margin: 2px 0;
background: rgba(255, 255, 255, 0.09);
}
.rb {
position: relative;
z-index: 1;
display: grid;
flex: none;
width: 36px;
height: 36px;
place-items: center;
border: 0;
padding: 0;
border-radius: 50%;
background: transparent;
color: var(--isl-muted);
cursor: pointer;
transition: color 0.2s;
}
.rb > * {
grid-area: 1 / 1;
}
.rb:hover,
.rb[data-active="true"] {
color: var(--isl-fg);
}
.rb:focus-visible {
outline: 2px solid var(--inf-fg);
outline-offset: 1px;
}
.rb[data-pr="open"] {
color: var(--ok-fg);
}
.rb[data-pr="merged"] {
color: var(--merged);
}
.rb[data-pr="draft"] {
color: var(--isl-muted);
}

.bd {
justify-self: end;
align-self: end;
min-width: 15px;
height: 15px;
margin: 0 -3px -2px 0;
padding: 0 3px;
border-radius: 8px;
background: #222226;
box-shadow: 0 0 0 2px var(--isl-bg);
color: var(--isl-fg);
font: 600 9px/15px var(--mono);
text-align: center;
white-space: nowrap;
animation: pop 0.35s var(--ease-spring);
}
.bd.info {
background: var(--inf);
color: #fff;
}
.bd.warn {
background: var(--warn);
color: #1a1203;
}
.bd.ok {
background: var(--ok);
color: #04140a;
}
@keyframes pop {
from {
transform: scale(0.3);
opacity: 0;
}
}

.ring {
width: 30px;
height: 30px;
overflow: visible;
transform: rotate(-90deg);
}
.ring .tr {
fill: none;
stroke: rgba(255, 255, 255, 0.1);
stroke-width: 2.5;
}
.ring .sg {
fill: none;
stroke-width: 2.5;
stroke-linecap: round;
transition: stroke 0.3s, stroke-dasharray 0.6s var(--ease-out), stroke-dashoffset 0.6s var(--ease-out);
}
.sg[data-s="pass"],
.sg[data-s="done"] {
stroke: var(--ok);
}
.sg[data-s="fail"] {
stroke: var(--bad);
}
.sg[data-s="running"] {
stroke: var(--warn);
animation: pulse 1.1s ease-in-out infinite;
}
.sg[data-s="current"] {
stroke: var(--inf);
animation: pulse 1.4s ease-in-out infinite;
}
.sg[data-s="blocked"] {
stroke: var(--warn);
}
.sg[data-s="q"] {
stroke: rgba(255, 255, 255, 0.17);
}
.sg[data-s="plan"] {
stroke: var(--plan);
}
@keyframes pulse {
50% {
opacity: 0.45;
}
}
.dot {
width: 7px;
height: 7px;
border-radius: 50%;
background: color-mix(in srgb, var(--isl-muted) 60%, transparent);
}
.dot[data-ci="pass"] {
background: var(--ok);
}
.dot[data-ci="fail"] {
background: var(--bad);
}
.dot[data-ci="running"] {
background: var(--warn);
animation: pulse 1.1s infinite;
}

.fly {
position: absolute;
right: calc(100% + 10px);
z-index: 5;
width: 300px;
padding: 14px;
border-radius: 22px;
background: var(--isl-bg);
border: 1px solid var(--isl-border);
box-shadow:
0 24px 60px -14px rgba(0, 0, 0, 0.6),
0 0 0 0.5px rgba(0, 0, 0, 0.4);
transform-origin: right 40px;
overflow: auto;
scrollbar-width: none;
transition: top 0.32s var(--ease-out);
}
.fly[hidden] {
display: none;
}
.fly.enter {
animation: fly-in 0.34s var(--ease-out);
}
@keyframes fly-in {
from {
opacity: 0;
transform: translateX(10px) scale(0.95);
}
}
.fly.pinned::after {
content: "";
position: absolute;
top: 12px;
right: 12px;
width: 5px;
height: 5px;
border-radius: 50%;
background: var(--isl-faint);
}
.dh {
display: flex;
align-items: center;
gap: 7px;
margin-bottom: 10px;
font-size: 12.5px;
font-weight: 600;
padding-right: 10px;
}
.dh > .ic {
color: var(--isl-muted);
}
.meta {
margin-left: auto;
flex: none;
display: inline-flex;
align-items: center;
gap: 6px;
font: 500 11px var(--mono);
color: var(--isl-muted);
}
.up {
color: var(--inf-fg);
}
.down {
color: var(--warn-fg);
}
.add {
color: var(--ok-fg);
font-style: normal;
}
.del {
color: var(--bad-fg);
font-style: normal;
}
.faint {
color: var(--isl-faint);
}
.muted {
color: var(--isl-muted);
}
.grp {
margin: 10px 4px 4px;
display: flex;
justify-content: space-between;
font-size: 10px;
font-weight: 600;
letter-spacing: 0.07em;
text-transform: uppercase;
color: var(--isl-faint);
}
.row {
display: flex;
align-items: center;
gap: 8px;
padding: 3px 4px;
min-width: 0;
}
.row .st {
flex: none;
width: 14px;
font: 600 10px var(--mono);
text-align: center;
}
.st.M {
color: var(--warn-fg);
}
.st.A {
color: var(--ok-fg);
}
.st.D {
color: var(--bad-fg);
}
.row .nm {
flex: 1;
}
.row .num {
flex: none;
font: 500 10.5px var(--mono);
}
.commit-row .hash {
flex: none;
font: 500 10.5px var(--mono);
color: var(--isl-faint);
}
.empty {
padding: 6px 4px;
color: var(--isl-muted);
}
.note {
display: flex;
gap: 8px;
align-items: flex-start;
margin-top: 8px;
padding: 8px 10px;
border-radius: 12px;
font-size: 11.5px;
background: color-mix(in srgb, var(--warn) 12%, transparent);
color: #fcd9a0;
}
.note .ic {
color: var(--warn-fg);
margin-top: 1px;
}

.btn {
height: 28px;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 6px;
padding: 0 11px;
border-radius: 999px;
border: 1px solid rgba(255, 255, 255, 0.1);
background: rgba(255, 255, 255, 0.07);
color: var(--isl-fg);
font: 500 12px/1 var(--sans);
white-space: nowrap;
cursor: pointer;
transition: background 0.15s, transform 0.15s, opacity 0.15s;
}
.btn:hover:not([disabled]) {
background: rgba(255, 255, 255, 0.13);
}
.btn:active:not([disabled]) {
transform: scale(0.97);
}
.btn.primary {
background: #f4f4f5;
color: #0d0d0e;
border-color: transparent;
}
.btn.primary:hover:not([disabled]) {
background: #fff;
}
.btn[disabled] {
opacity: 0.38;
cursor: not-allowed;
}
.btn:focus-visible {
outline: 2px solid var(--inf-fg);
outline-offset: 2px;
}
.actions {
display: flex;
gap: 6px;
margin-top: 10px;
}
.actions > * {
flex: 1;
}
.field {
width: 100%;
height: 30px;
padding: 0 11px;
border-radius: 10px;
border: 1px solid rgba(255, 255, 255, 0.1);
background: rgba(255, 255, 255, 0.04);
color: var(--isl-fg);
font: 12px var(--sans);
outline: none;
transition: border-color 0.15s, background 0.15s;
}
.field::placeholder {
color: var(--isl-faint);
}
.field:focus {
border-color: color-mix(in srgb, var(--inf) 70%, transparent);
background: rgba(255, 255, 255, 0.06);
}
.pill {
display: inline-flex;
align-items: center;
gap: 4px;
height: 18px;
padding: 0 7px;
border-radius: 999px;
font: 600 10.5px/1 var(--sans);
background: rgba(255, 255, 255, 0.08);
color: var(--isl-muted);
}
.pill.open {
background: color-mix(in srgb, var(--ok) 18%, transparent);
color: var(--ok-fg);
}
.pill.merged {
background: color-mix(in srgb, var(--merged) 18%, transparent);
color: var(--merged);
}
.pill.draft {
background: rgba(255, 255, 255, 0.08);
color: var(--isl-muted);
}
.mini-ring {
width: 14px;
height: 14px;
}
.bar-split {
display: flex;
height: 3px;
gap: 2px;
margin: 2px 4px 6px;
border-radius: 2px;
overflow: hidden;
}
.bar-split i {
display: block;
border-radius: 2px;
}
@media (prefers-reduced-motion: reduce) {
*,
*::before,
*::after {
animation-duration: 0.001ms !important;
transition-duration: 0.001ms !important;
}
}

.chips {
display: flex;
align-items: stretch;
gap: 4px;
list-style: none;
margin: 8px 0 0;
padding: 0;
}
.chips .arrow {
align-self: center;
color: var(--isl-faint);
font-size: 12px;
}
.chip {
flex: 1;
min-width: 0;
display: grid;
grid-template-columns: auto 1fr;
column-gap: 5px;
align-items: center;
padding: 6px 7px;
border-radius: 10px;
background: rgba(255, 255, 255, 0.04);
box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
color: var(--isl-muted);
transition: background 0.3s, color 0.3s, box-shadow 0.3s;
}
.chip span {
font-size: 11.5px;
font-weight: 600;
color: var(--isl-fg);
white-space: nowrap;
}
.chip small {
grid-column: 2;
font: 500 10px var(--mono);
color: var(--isl-faint);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.chip .ic {
grid-row: span 2;
}
.chip[data-state="now"] {
background: color-mix(in srgb, var(--inf) 14%, transparent);
box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--inf) 45%, transparent);
color: var(--inf-fg);
}
.chip[data-state="done"] {
color: var(--ok-fg);
}
.chip[data-state="done"] span {
color: var(--isl-muted);
}
.chips.vert {
flex-direction: column;
}

switch (step) {
case "commit":
return plural(st.files, "file");
case "pull":
return `${st.behind} incoming`;
case "push":
return s.upstream ? `to origin` : "new branch";
case "pr":
return "into main";
}
}
let chainCancel = false;

async function runChain(steps, { delay = 0 } = {}) {
if (S.busy || !steps.length) {
if (!steps.length && S.pr?.state === "open") run("openpr");
return;
}
chainCancel = false;
S.busy = "chain";
// Step details are frozen at the click, so "3 files" stays "3 files" while it runs.
S.chain = { steps, i: -1, total: steps.length, details: steps.map((x) => stepDetail(x, S)) };
if (delay) {
S.chain.counting = true;
showIsland("var(--inf)", "loader", `Shipping in a moment…`, `${chainLabel(steps, S)} · Esc to cancel`, true);
renderAll();
await sleep(delay);
S.chain.counting = false;
if (chainCancel) {
S.busy = null;
S.chain = null;
renderAll();
showIsland("var(--isl-muted)", "x", "Cancelled", "Nothing was changed");
return;
}
}
let prNumber = null;
for (let i = 0; i < steps.length; i++) {
S.chain.i = i;
const step = steps[i];
showIsland("var(--isl-muted)", "loader", `${STEP[step].verb}… ${i + 1}/${steps.length}`, stepDetail(step, S), true);
renderAll();
await sleep(step === "pr" ? 1000 : 800);
if (step === "pr") {
S.pr = newPr(S);
prNumber = S.pr.number;
} else ACTIONS[step].run(S);
}
S.chain = null;
S.busy = null;
renderAll();
const last = steps.at(-1);
showIsland("var(--ok)", "checkCircle", prNumber ? `Shipped · PR #${prNumber} opened` : `${STEP[last].done}`, chainLabel(steps, { pr: null }) + " · done");
}
document.addEventListener("keydown", (e) => {
if (e.key === "Escape" && S?.chain?.counting) chainCancel = true;
});

function stepChips(steps, s, { vertical = false } = {}) {
if (!steps.length) return "";
const running = s.chain;
return `<ol class="chips ${vertical ? "vert" : ""}">${steps
.map((step, i) => {
const state = !running ? "todo" : i < running.i ? "done" : i === running.i ? "now" : "todo";
const icon = state === "done" ? I("check", "xs") : state === "now" ? I("loader", "xs spin") : I(STEP[step].icon, "xs");
return `<li class="chip" data-state="${state}">${icon}<span>${STEP_WORD[step][0].toUpperCase() + STEP_WORD[step].slice(1)}</span><small>${running?.details?.[i] ?? stepDetail(step, s)}</small></li>`;
})
.join(vertical ? "" : '<li class="arrow" aria-hidden="true">›</li>')}</ol>`;
}
// 3 · "Ship to" select: pick how far a click goes (Commit · Push · PR) once; it is remembered.
// The single button then does every step up to there, skipping what is already done.
const v6css = document.createElement("style");
v6css.textContent = `
.fly { width: 308px; }
.goal-l { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 6px; font-size: 10px; font-weight: 600;
letter-spacing: .07em; text-transform: uppercase; color: var(--isl-faint); }
.goal-l small { font: 500 10px var(--sans); letter-spacing: 0; text-transform: none; }
.seg3 { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 12px; background: rgba(255,255,255,.05);
box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.seg3 .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 9px; background: rgba(255,255,255,.12);
box-shadow: 0 1px 2px rgba(0,0,0,.4); transition: transform .38s var(--ease-spring); }
.seg3 button { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; border: 0; background: none;
color: var(--isl-muted); font: 500 12px var(--sans); cursor: pointer; transition: color .2s; }
.seg3 button[aria-pressed="true"] { color: var(--isl-fg); }
.seg3 button .ic { width: 13px; height: 13px; }
.track { list-style: none; margin: 12px 0 0; padding: 0; }
.tr-row { position: relative; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; column-gap: 9px; padding: 5px 2px; }
.tr-row:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 25px; height: 12px; width: 2px; border-radius: 1px; background: rgba(255,255,255,.08); }
.tr-dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid rgba(255,255,255,.14); color: var(--isl-faint); }
.tr-dot .ic { width: 11px; height: 11px; }
.tr-row b { font-size: 12.5px; font-weight: 500; }
.tr-row small { font: 500 10.5px var(--mono); color: var(--isl-faint); white-space: nowrap; }
.tr-row[data-s="run"] .tr-dot { border-color: var(--inf); color: var(--inf-fg); }
.tr-row[data-s="now"] .tr-dot { border-color: var(--inf); background: color-mix(in srgb, var(--inf) 20%, transparent); color: var(--inf-fg); }
.tr-row[data-s="did"] .tr-dot, .tr-row[data-s="done"] .tr-dot { border-color: var(--ok); background: var(--ok); color: #04140a; }
.tr-row[data-s="done"] b { color: var(--isl-muted); }
.tr-row[data-s="later"] { opacity: .4; }
.tr-row[data-s="later"] b { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.25); }
.tr-row[data-s="skip"] b { color: var(--isl-muted); }
.go { width: 100%; height: 36px; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px;
background: #f4f4f5; color: #0d0d0e; font: 600 13px var(--sans); cursor: pointer; transition: background .15s, transform .15s, opacity .15s; }
.go:hover:not([disabled]) { background: #fff; }
.go:active:not([disabled]) { transform: scale(.985); }
.go[disabled] { opacity: .5; cursor: default; }
.go[data-quiet="true"] { background: rgba(255,255,255,.08); color: var(--isl-fg); }
.go .ic { width: 15px; height: 15px; }
.opts { display: flex; align-items: center; gap: 12px; margin-top: 9px; font-size: 11px; color: var(--isl-faint); }
.opts label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.opts input { accent-color: #f4f4f5; margin: 0; }
.opts button { margin-left: auto; border: 0; background: none; padding: 0; color: var(--isl-muted); font: inherit; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.opts button:hover { color: var(--isl-fg); }
`;
document.head.append(v6css);
const GOAL_META = {
commit: { label: "Commit", icon: "commit" },
push: { label: "Push", icon: "cloudUp" },
pr: { label: "PR", icon: "pr" },
};

function trackRows(s, goal) {
const steps = s.chain ? s.chain.steps : planChain(s, goal);
const g = GOALS.indexOf(goal);
const st = stats(s);
const rows = [
{ id: "commit", title: "Commit", tier: 0, idle: "nothing to commit" },
{ id: "pull", title: "Pull first", tier: 1, idle: "origin has nothing new", hideIdle: true },
{ id: "push", title: "Push", tier: 1, idle: s.upstream ? "already on origin" : "nothing to push" },
{ id: "pr", title: s.pr?.state === "open" ? `PR #${s.pr.number}` : "Open pull request", tier: 2, idle: s.pr?.state === "open" ? "already open" : "nothing new to propose" },
];
return rows
.map((r) => {
const idx = steps.indexOf(r.id);
let state;
let detail;
if (idx >= 0) {
state = !s.chain ? "run" : idx < s.chain.i ? "did" : idx === s.chain.i ? "now" : "run";
detail = s.chain?.details?.[idx] ?? stepDetail(r.id, s);
} else if (r.tier > g) {
state = "later";
detail = "not this time";
} else {
state = r.id === "pr" && s.pr?.state === "open" ? "done" : r.id === "push" && s.upstream && !st.ahead ? "done" : "skip";
detail = r.idle;
if (r.hideIdle) return "";
}
const icon = state === "did" || state === "done" ? I("check") : state === "now" ? I("loader", "spin") : I(STEP[r.id].icon);
return `<li class="tr-row" data-s="${state}"><span class="tr-dot">${icon}</span><b>${r.title}</b><small>${detail}</small></li>`;
})
.join("");
}
function shipToFly(s) {
const goal = s.ui.goal ?? defaultGoal(s);
const steps = s.chain ? s.chain.steps : planChain(s, goal);
const running = !!s.chain;
const gi = GOALS.indexOf(goal);
const quiet = !steps.length;
const label = running
? `${STEP[steps[s.chain.i]]?.verb ?? "Starting"}… ${s.chain.i + 1}/${steps.length}`
: quiet
? s.pr?.state === "open"
? `View PR #${s.pr.number}`
: `Already at ${GOAL_META[goal].label}`
: chainLabel(steps, s);
return `
<div class="dh">${I("branch", "sm")}<span class="mono trunc">${BRANCH}</span><span class="meta">${abText(s)}</span></div>
<div class="goal-l"><span>Ship to</span><small>${s.ui.goal ? "remembered for this project" : "suggested"}</small></div>
<div class="seg3" role="radiogroup" aria-label="Ship to">
<span class="thumb" style="transform:translateX(${gi * 100}%)"></span>
${GOALS.map((g) => `<button type="button" role="radio" data-act="goal:${g}" aria-pressed="${g === goal}" ${running ? "disabled" : ""}>${I(GOAL_META[g].icon)}${GOAL_META[g].label}</button>`).join("")}
</div>
<ol class="track">${trackRows(s, goal)}</ol>
<button type="button" class="go" data-act="ship" data-quiet="${quiet && !running}" ${running || (quiet && s.pr?.state !== "open") ? "disabled" : ""}>
${running ? I("loader", "spin") : quiet ? I(s.pr?.state === "open" ? "ext" : "checkCircle") : I("rocket")}<span class="trunc">${label}</span>
</button>
<div class="opts">
${goal === "pr" ? `<label><input type="checkbox" data-f="draft" ${s.ui.draft ? "checked" : ""}/>Draft PR</label>` : ""}
${steps.includes("commit") ? `<span>${I("sparkles", "xs")} message written for you</span>` : ""}
</div>`;
}
boot({
tag: "3 · Ship to…",
hint: "Pick how far a click goes, then press the one button · the list shows what runs, what's done and what's skipped · actions are simulated.",
primaryKey: "git",
chat: "One <b>Source control</b> item replaces Branch and Push. You choose once how far a click goes (<b>Commit</b>, <b>Push</b> or <b>PR</b>), and the single button then does every step up to there.",
rail(s) {
const st = stats(s);
const glyph = s.chain
? ring(s.chain.steps.map((_, i) => (i < s.chain.i ? "done" : i === s.chain.i ? "current" : "q")), { gap: 10 }) + `<span style="display:grid">${I("branch", "xs")}</span>`
: I("branch") + (st.files ? badge(st.files) : st.ahead ? badge(`↑${st.ahead}`, "info") : st.behind ? badge(`↓${st.behind}`, "warn") : "");
return [
{ key: "git", label: "Source control", group: "status", glyph },
COMMON_RAIL.changes(s),
COMMON_RAIL.checks(s),
COMMON_RAIL.plan(s),
COMMON_RAIL.agents(s),
COMMON_RAIL.pr(s),
COMMON_RAIL.notes(s),
];
},
fly: { git: shipToFly },
ui(act, s) {
if (act.startsWith("goal:")) {
s.ui.goal = act.slice(5);
return true;
}
if (act === "ship") {
const steps = planChain(s, s.ui.goal ?? defaultGoal(s));
if (steps.length) runChain(steps);
else if (s.pr?.state === "open") run("openpr");
return false;
}
return false;
},
});
// The chosen goal outlives a scenario switch, the way a per-project preference would.
let savedGoal = null;
const v6ui = V.ui;
V.ui = (act, s) => {
if (act.startsWith("goal:")) savedGoal = act.slice(5);
return v6ui(act, s);
};
const v6load = load;
load = (key) => {
v6load(key);
if (savedGoal) {
S.ui.goal = savedGoal;
renderAll();
}
};
</script></body></html>
