        let cur = null;
        work.forEach((b, i) => {
          if (!cur || (bounds.has(i) && cur.beats.length)) {
            cur = { index: chapters.length, say: null, beats: [] };
            chapters.push(cur);
          }
          cur.beats.push(b);
          b.ch = cur.index;
          if (b.t === "say") cur.say = b;
        });
        for (const ch of chapters) {
          ch.sStart = ch.beats[0].sStart;
          ch.sEnd = Math.max(...ch.beats.map((b) => b.sStart + b.sDur));
        }

        const changes = new Map();
        for (const b of beats) {
          if (b.kind !== "edit" && b.kind !== "create") continue;
          const c = changes.get(b.target) ?? {
            path: b.target,
            add: 0,
            del: 0,
            created: b.kind === "create",
          };
          c.add += b.add;
          c.del += b.del;
          changes.set(b.target, c);
        }

        const final = beats.find((b) => b.t === "final");
        return {
          scn,
          beats,
          keys,
          chapters,
          final,
          changes: [...changes.values()],
          pTotal: p + 200,
          sTotal: s,
          workDur: s,
          tools: beats.filter((b) => b.t === "tool"),
        };
      }

      /** Piecewise-linear play-time → sim-time. */
      function simAt(comp, P) {
        const k = comp.keys;
        if (P <= k[0][0]) return 0;
        for (let i = 1; i < k.length; i++) {
          if (P <= k[i][0]) {
            const [p0, s0] = k[i - 1];
            const [p1, s1] = k[i];
            return p1 === p0 ? s1 : s0 + ((P - p0) / (p1 - p0)) * (s1 - s0);
          }
        }
        return k[k.length - 1][1];
      }

      /* ==========================================================
         Shared components
         ========================================================== */
      function targetText(b) {
        if (b.kind === "search") return `“${b.target}”`;
        if (b.kind === "read" || b.kind === "edit" || b.kind === "create")
          return shortPath(b.target);
        return b.target;
      }
      function isMono(b) {
        return b.kind === "read" || b.kind === "edit" || b.kind === "create" || b.kind === "run";
      }
      /** Present-tense description for captions: "Reading relay/client.ts". */
      function liveText(b) {
        if (b.t === "think") return "Thinking";
        if (b.t === "say") return "Writing an update";
        return `${KIND[b.kind].live} ${targetText(b)}`;
      }
      function diffStat(add, del, { created = false } = {}) {
        const out = h("span", { class: "tnum" }, h("span", { class: "add" }, `+${add}`));
        if (del > 0) out.append(" ", h("span", { class: "del" }, `−${del}`));
        return out;
      }
      function resultMeta(beats) {
        const ended = beats.filter((b) => b._done);
        if (!ended.length) return null;
        const b = ended[ended.length - 1];
        switch (b.kind) {
          case "search": {
            const n = ended.reduce((a, x) => a + x.results, 0);
            return { kind: "count", n, fmt: (v) => plural(v, ["result", "results"]) };
          }
          case "edit":
          case "create":
            return {
              kind: "node",
              node: diffStat(
                ended.reduce((a, x) => a + x.add, 0),
                ended.reduce((a, x) => a + x.del, 0),
                { created: ended.every((x) => x.kind === "create") },
              ),
            };
          case "run":
          case "web":
          case "agent":
            return { kind: "text", text: b.summary ?? fmtDur(b.sDur), fail: b.ok === false };
          default:
            return null;
        }
      }

      /** Expanded detail for one row (single or merged beats). */
      function detailView(beats) {
        const b = beats[0];
        if (b.t === "think") return h("div", { class: "dv dv-think" }, b.text);
        if (b.kind === "read")
          return h(
            "div",
            { class: "dv dv-list" },
            beats.map((x) =>
              h(
                "div",
                { class: "dv-li" },
                h("span", { class: "mono" }, x.target),
                h("span", { class: "n" }, `lines ${x.lines}`),
              ),
            ),
          );
        if (b.kind === "search") {
          if (beats.length > 1)
            return h(
              "div",
              { class: "dv dv-list" },
              beats.map((x) =>
                h(
                  "div",
                  { class: "dv-li" },
                  h("span", null, `“${x.target}”`),
                  h(
                    "span",
                    { class: "n" },
                    x._done ? plural(x.results, ["result", "results"]) : "…",
                  ),
                ),
              ),
            );
          return h(
            "div",
            { class: "dv dv-list" },
            b.files.map(([f, n]) =>
              h(
                "div",
                { class: "dv-li" },
                h("span", { class: "mono" }, f),
                h("span", { class: "n" }, n),
              ),
            ),
          );
        }
        if (b.kind === "edit" || b.kind === "create")
          return h(
            "div",
            { class: "dv" },
            h(
              "pre",
              null,
              b.diff.map((l) =>
                h(
                  "div",
                  {
                    class: l[0] === "+" ? "lp" : l[0] === "-" ? "lm" : l[0] === "@" ? "cmd" : null,
                  },
                  l[0] === "@" ? l : l,
                ),
              ),
            ),
            h("div", { class: "dv-foot" }, b.target),
          );
        if (b.kind === "run")
          return h(
            "div",
            { class: "dv" },
            h(
              "pre",
              null,
              h("div", { class: "cmd" }, `$ ${b.target}`),
              (b._done ? b.out : ["…"]).map((l) =>
                l.startsWith("!")
                  ? h("div", { class: "err" }, l.slice(1))
                  : h("div", null, l || " "),
              ),
            ),
            h(
              "div",
              { class: "dv-foot" },
              b._done ? `exit ${b.ok ? 0 : 1} · ${fmtDur(b.sDur)}` : "running…",
            ),
          );
        if (b.kind === "agent")
          return h(
            "div",
            { class: "dv" },
            h("div", null, b.target),
            h(
              "div",
              { class: "dv-foot" },
              b._done ? `${b.summary} · ran for ${fmtDur(b.sDur)}` : "working…",
            ),
          );
        return h(
          "div",
          { class: "dv" },
          h("div", { class: "mono" }, `https://${b.target}`),
          h("div", { class: "dv-foot" }, b.summary ?? ""),
        );
      }

      /**
       * One step row: glyph · verb · target · meta. Same-kind exploration
       * calls can merge into it ("Read 4 files"). Thinking rows can stream
       * the reasoning through a two-line window (`thinkWin`).
       */
      function createRow(b0, { thinkWin = false } = {}) {
        const isThink = b0.t === "think";
        const k = isThink ? KIND.think : KIND[b0.kind];
        const beats = [b0];
        const g = glyph(isThink ? "think" : "run");
        const verb = h("span", { class: "r-verb roll" });
        const count = h("span", { class: "r-count roll", hidden: true });
        const target = isThink
          ? h("span", { class: "r-target faint" })
          : h("span", { class: `r-target roll ${isMono(b0) ? "mono" : ""}` });
        const meta = h("span", { class: "r-meta tnum" });
        const main = h(
          "button",
          { class: "r-main", type: "button", "aria-expanded": "false" },
          g,
          h("span", { class: "r-label" }, verb, count, target),
          meta,
        );
        const el = h("div", { class: "row", "data-kind": isThink ? "think" : b0.kind }, main);
        let win = null;
        let winInner = null;
        let winStream = null;
        let winH = 0;
        let detail = null;
        let lastSec = -1;
        let tailN = -1;
        if (isThink && thinkWin) {
          winInner = h("div");
          win = h("div", { class: "r-win" }, winInner);
          el.append(win);
          winStream = streamer(winInner, b0.text, { caret: false });
        }
        main.title = isThink ? "" : beats.map((b) => b.target).join("\n");

        const running = () => beats.some((b) => !b._done);
        const failed = () => beats.some((b) => b._done && b.ok === false);
        function paint() {
          const run = running();
          el.dataset.state = run ? "run" : failed() ? "fail" : "ok";
          setGlyph(
            g,
            isThink ? (run ? "think" : "thought") : run ? "run" : failed() ? "fail" : "ok",
          );
          verb.classList.toggle("shimmer", run);
          if (isThink) {
            swapRoll(verb, run ? "Thinking" : `Thought for ${fmtDur(b0.sDur)}`);
            if (!run) target.textContent = "";
          } else {
            swapRoll(verb, run ? k.live : k.done);
            if (beats.length > 1) {
              count.hidden = false;
              swapRoll(count, plural(beats.length, k.noun));
              target.classList.add("faint");
              swapRoll(target, baseName(beats[beats.length - 1].target));
            } else swapRoll(target, targetText(b0));
          }
          const r = run ? null : resultMeta(beats);
          if (r) {
            meta.classList.toggle("fail", !!r.fail);
            if (r.kind === "count") tween(meta, r.n, { fmt: r.fmt });
            else if (r.kind === "node") meta.replaceChildren(r.node);
            else meta.textContent = r.text;
            fadeIn(meta, { y: 0, dur: 260 });
          } else if (run && !isThink && beats.length > 1 && b0.kind === "search") {
            const r2 = resultMeta(beats);
            if (r2) tween(meta, r2.n, { fmt: r2.fmt });
          }
          main.title = isThink ? "" : beats.map((b) => b.target).join("\n");
        }
        paint();

        main.addEventListener("click", () => {
          const open = main.getAttribute("aria-expanded") === "true";
          main.setAttribute("aria-expanded", String(!open));
          if (open) {
            const d = detail;
            detail = null;
            leave(d, () => d.remove());
          } else {
            detail = h("div", { class: "r-detail" }, detailView(beats));
            el.append(detail);
            enter(detail, { blur: 0 });
          }
        });

        return {
          el,
          beats,
          get kind() {
            return isThink ? "think" : b0.kind;
          },
          canMerge(b) {
            return (
              !isThink && b.t === "tool" && b.kind === b0.kind && KIND[b.kind].merge && !detail
            );
          },
          add(b) {
            beats.push(b);
            paint();
            pop(count, 1.12);
          },
          progress(b, f) {
            if (!isThink) return;
            if (winStream) {
              winStream.set(f);
              const nh = winInner.offsetHeight;
              if (winH && nh > winH && live())
                winInner.animate(
                  [{ transform: `translateY(${nh - winH}px)` }, { transform: "none" }],
                  {
                    duration: 320,
                    easing: GENTLE,
                  },
                );
              winH = nh;
            } else if (b._started && !b._done) {
              const n = Math.floor(f * b.text.length);
              if (n - tailN < 3) return;
              tailN = n;
              const s = b.text.slice(Math.max(0, n - 60), n);
              target.textContent = n > 60 ? `…${s.slice(s.indexOf(" ") + 1)}` : s;
            }
          },
          end() {
            paint();
            if (win && !beats.some((x) => !x._done)) {
              const w = win;
              win = null;
              leave(w, () => w.remove(), { dur: 380 });
            }
          },
          tick(sim) {
            if (isThink || !running()) return;
            const b = beats.find((x) => !x._done);
            if (!b || !["run", "web", "agent"].includes(b.kind)) return;
            const sec = Math.floor(sim - b.sStart);
            if (sec === lastSec || sec < 1) return;
            lastSec = sec;
            meta.classList.remove("fail");
            meta.textContent = fmtTimer(sec);
          },
          flash() {
            flash(el);
          },
          finishInstant() {
            paint();
          },
        };
      }

      /**
       * Ordered rows with optional merging (`merge`) and a fixed-height
       * ticker window (`window` rows; older ones scroll out the top).
       */
      function createStepList({ merge = false, thinkWin = false, window = 0, onMore } = {}) {
        const el = h("div", { class: "steps" });
        const rows = [];
        const byId = new Map();
        let tail = null;
        let hiddenCount = 0;
        const moreLabel = h("span", { class: "roll" });
        const more = window
          ? h(
              "button",
              { class: "c-more", type: "button", hidden: true },
              icon("chevronUp"),
              moreLabel,
            )
          : null;
        if (more) {
          el.append(more);
          more.addEventListener("click", () => onMore?.());
        }
        const visible = () => rows.filter((r) => !r.gone);
        function age() {
          if (!window) return;
          const v = visible();
          v.forEach((r, i) => (r.el.dataset.age = String(Math.min(3, v.length - 1 - i))));
        }
        return {
          el,
          rows,
          breakMerge() {
            tail = null;
          },
          appendBlock(node) {
            el.append(node);
            enter(node);
            tail = null;
          },
          start(b) {
            let row;
            if (merge && tail && tail.canMerge(b)) {
              row = tail;
              row.add(b);
            } else {
              row = createRow(b, { thinkWin });
              rows.push(row);
              el.append(row.el);
              enter(row.el);
              tail = row;
              if (window) {
                const v = visible();
                if (v.length > window) {
                  const old = v[0];
                  old.gone = true;
                  hiddenCount++;
                  leave(old.el, () => old.el.remove(), { dur: 360, y: -8 });
                  if (more.hidden) {
                    more.hidden = false;
                    enter(more, { blur: 0 });
                  }
                  swapRoll(moreLabel, plural(hiddenCount, ["earlier step", "earlier steps"]));
                }
                age();
              }
            }
            byId.set(b.id, row);
            return row;
          },
          progress(b, f) {
            byId.get(b.id)?.progress(b, f);
          },
          end(b) {
            byId.get(b.id)?.end(b);
          },
          tick(sim) {
            for (const r of rows) if (!r.gone) r.tick(sim);
          },
          row(id) {
            return byId.get(id);
          },
          get hidden() {
            return hiddenCount;
          },
        };
      }

      /** Per-kind counters: icon + rolling number. Fail + diffstat chips last. */
      function createChips({ diff = true } = {}) {
        const el = h("span", { class: "chips" });
        const map = new Map();
        for (const [key, kinds] of CHIP_KINDS) {
          const n = h("span", { class: "roll tnum" });
          const c = h("span", { class: "chip", hidden: true }, icon(KIND[key].icon), n);
          el.append(c);
          for (const kk of kinds) map.set(kk, { key, c, n, v: 0 });
        }
        const failN = h("span", { class: "roll tnum" });
        const failC = h(
          "span",
          { class: "chip fail", hidden: true, title: "Failed steps" },
          icon("alert"),
          failN,
        );
        const addN = h("span", { class: "add tnum" });
        const delN = h("span", { class: "del tnum" });
        const diffC = h("span", { class: "chip chip-diff", hidden: true }, addN, delN);
        el.append(failC, diffC);
        let fails = 0;
        let add = 0;
        let del = 0;
        const reveal = (c) => {
          if (!c.hidden) return;
          c.hidden = false;
          if (live())
            c.animate(
              [
                { opacity: 0, transform: "scale(.6)" },
                { opacity: 1, transform: "none" },
              ],
              { duration: 320, easing: SNAPPY },
            );
        };
        const shared = new Map();
        return {
          el,
          count(b) {
            const m = map.get(b.kind);
            if (!m) return;
            const v = (shared.get(m.key) ?? 0) + 1;
            shared.set(m.key, v);
            reveal(m.c);
            swapRoll(m.n, String(v));
            m.c.title = `${plural(v, KIND[m.key].noun)}`;
            pop(m.c.firstElementChild, 1.3);
          },
          end(b) {
            if (b.ok === false) {
              fails++;
              reveal(failC);
              swapRoll(failN, String(fails));
              pop(failC.firstElementChild, 1.4);
            }
            if (diff && (b.kind === "edit" || b.kind === "create")) {
              tween(addN, (add += b.add), { fmt: (v) => `+${v}` });
              tween(delN, (del += b.del), { fmt: (v) => `−${v}` });
              reveal(diffC);
            }
          },
        };
      }

      /** Compact changed-files summary (A / B / C). */
      function createChanges(changes) {
        const add = changes.reduce((a, c) => a + c.add, 0);
        const del = changes.reduce((a, c) => a + c.del, 0);
        const files = h(
          "div",
          { class: "ch-files", hidden: true },
          changes.map((c) => {
            const parts = c.path.split("/");
            return h(
              "div",
              { class: "ch-file" },
              h("span", { class: "nm" }, parts.pop()),
              h("span", { class: "dir" }, parts.join("/")),
              h("span", { class: "ch-stat" }, diffStat(c.add, c.del, { created: c.created })),
            );
          }),
        );
        const toggle = h(
          "button",
          { class: "ch-toggle", type: "button", "aria-expanded": "false" },
          icon("fileDiff"),
          `${plural(changes.length, ["file", "files"])} changed`,
          icon("chevronDown", "run-chev"),
        );
        const el = h(
          "div",
          { class: "changes" },
          h(
            "div",
            { class: "ch-head" },
            toggle,
            h("span", { class: "ch-stat" }, diffStat(add, del)),
            h("span", { style: { flex: "1" } }),
            h("button", { class: "ch-act", type: "button" }, icon("undo"), "Undo"),
            h("button", { class: "ch-act", type: "button" }, "Review", icon("chevronRight")),
          ),
          files,
        );
        toggle.addEventListener("click", () => {
          const open = toggle.getAttribute("aria-expanded") === "true";
          toggle.setAttribute("aria-expanded", String(!open));
          morphHeight(el, () => (files.hidden = open));
        });
        return el;
      }

      /** Shared run header: mark · status · timer · summary · chevron. */
      function createRunHead({ onToggle } = {}) {
        const mark = claudeMark("run-mark");
        const status = h("span", { class: "run-status roll shimmer" });
        swapRoll(status, "Working");
        const clock = h("span", { class: "run-clock tnum" }, "0s");
        const sum = h("span", { class: "run-sum" });
        const chev = icon("chevronDown", "run-chev");
        const el = h(
          "button",
          { class: "run-head", type: "button", "aria-expanded": "true" },
          mark,
          status,
          clock,
          h("span", { class: "grow" }),
          sum,
          chev,
        );
        el.addEventListener("click", () => onToggle?.());
        let lastSec = -1;
        return {
          el,
          sum,
          tick(sim) {
            const s = Math.floor(sim);
            if (s !== lastSec) {
              lastSec = s;
              clock.textContent = fmtTimer(s);
            }
          },
          done(total) {
            status.classList.remove("shimmer");
            swapRoll(status, "Worked for");
            clock.textContent = fmtDur(total);
            fadeIn(clock, { y: 0 });
          },
          setOpen(open) {
            el.setAttribute("aria-expanded", String(open));
          },
        };
      }

      /* ==========================================================
         Today — MessagesTimeline as it ships, for comparison
         ========================================================== */
      function todayIcon(b) {
        if (b.ok === false) return icon("alert", "err");
        if (b.kind === "run") return icon(/^(git|gh) /.test(b.target) ? "gitBranch" : "terminal");
        if (b.kind === "edit" || b.kind === "create") return icon("pencil");
        if (b.kind === "web") return icon("globe");
        if (b.kind === "agent") return icon("bot");
        return icon("search");
      }
      function todaySummary(entries) {
        const files = (kinds) =>
          new Set(entries.filter((b) => kinds.includes(b.kind)).map((b) => b.target)).size;
        const n = (kinds) => entries.filter((b) => kinds.includes(b.kind)).length;
        const parts = [];
        if (n(["run"])) parts.push(`Ran ${plural(n(["run"]), ["command", "commands"])}`);
        if (files(["edit", "create"]))
          parts.push(`Edited ${plural(files(["edit", "create"]), ["file", "files"])}`);
        if (files(["read"])) parts.push(`Read ${plural(files(["read"]), ["file", "files"])}`);
        if (n(["search"])) parts.push(`Searched ${plural(n(["search"]), ["file", "files"])}`);
        if (n(["agent"])) parts.push(`Ran ${plural(n(["agent"]), ["agent task", "agent tasks"])}`);
        if (n(["web"])) parts.push(`Used ${plural(n(["web"]), ["tool", "tools"])}`);
        return parts.join(", ");
      }
      function mountToday(host, { comp }) {
        const label = h("span", { class: "tnum" }, "Working for 0s");
        const fold = h(
          "button",
          { class: "t-fold", type: "button", "aria-expanded": "true" },
          label,
          icon("chevronRight"),
        );
        const body = h("div", { class: "t-body" });
        const thinking = h(
          "div",
          { class: "t-thinking", hidden: true },
          h("span", { class: "shimmer-text" }, "Thinking"),
        );
        const root = h(
          "div",
          { class: "t-run" },
          fold,
          h("div", { class: "t-rule" }),
          body,
          thinking,
        );
        host.append(root);
        let group = null;
        const groupOf = new Map();
        let lastMsgEnd = 0;
        let open = true;
        let lastSec = -1;
        const streams = new Map();
        let done = false;
        fold.addEventListener("click", () => {
          if (!done) return;
          open = !open;
          fold.setAttribute("aria-expanded", String(open));
          morphHeight(root, () => (body.hidden = !open));
        });

        function newGroup() {
          const ic = h("span", { style: { display: "inline-grid" } });
          const text = h("span", null);
          const row = h(
            "button",
            { class: "t-row", type: "button", "aria-expanded": "false" },
            ic,
            text,
            icon("chevronRight", "chev"),
          );
          const list = h("div", { class: "t-entries", hidden: true });
          const g = { entries: [], row, list, ic, text };
          row.addEventListener("click", () => {
            const o = row.getAttribute("aria-expanded") === "true";
            row.setAttribute("aria-expanded", String(!o));
            morphHeight(list, () => (list.hidden = o));
          });
          body.append(row, list);
          enter(row, { blur: 0 });
          return g;
        }
        function paintGroup(g) {
          const running = g.entries.some((b) => !b._done);
          if (g.entries.length === 1) {
            const b = g.entries[0];
            g.text.textContent = `${running ? KIND[b.kind].live : KIND[b.kind].done} ${b.target}${running ? "" : ` · ${b.ok === false ? "Failed" : "Completed"}`}`;
          } else g.text.textContent = `${todaySummary(g.entries)}${running ? " · Running" : ""}`;
          g.ic.replaceChildren(todayIcon(g.entries[0]));
          g.list.replaceChildren(
            ...g.entries.map((b) =>
              h(
                "div",
                { class: "t-entry" },
                todayIcon(b),
                h("span", null, `${KIND[b.kind].done} ${b.target}`),
              ),
            ),
          );
        }
        return {
          start(b) {
            if (b.t === "think") {
              thinking.hidden = false;
              return;
            }
            if (b.t === "say") {
              thinking.hidden = true;
              group = null;
              const p = h("div", { class: "prose" });
              const meta = h("div", { class: "t-meta" }, fmtWall(b.sStart));
              const msg = h("div", { class: "t-msg" }, p, meta);
              body.append(msg);
              fadeIn(msg);
              streams.set(b.id, { s: streamer(p, b.text, { caret: false }), meta, b });
              return;
            }
            thinking.hidden = true;
            if (!group) group = newGroup();
            group.entries.push(b);
            groupOf.set(b, group);
            paintGroup(group);
          },
          progress(b, f) {
            streams.get(b.id)?.s.set(f);
          },
          end(b) {
            const st = streams.get(b.id);
            if (st) {
              st.s.finish();
              const endS = b.sStart + b.sDur;
              st.meta.textContent = `${fmtWall(b.sStart)} • ${fmtDur(endS - lastMsgEnd)}`;
              lastMsgEnd = endS;
              return;
            }
            const g = groupOf.get(b);
            if (g) paintGroup(g);
          },
          finalMeta(b) {
            return `${fmtWall(b.sStart)} • ${fmtDur(b.sStart + b.sDur - lastMsgEnd)}`;
          },
          tick(sim) {
            if (done) return;
            const s = Math.floor(sim);
            if (s !== lastSec) {
              lastSec = s;
              label.textContent = `Working for ${fmtTimer(s)}`;
            }
          },
          finalStart() {
            done = true;
            thinking.hidden = true;
            label.textContent = `Worked for ${fmtDur(comp.workDur)}`;
            open = false;
            fold.setAttribute("aria-expanded", "false");
            morphHeight(root, () => (body.hidden = true));
          },
          renderChanges() {
            const add = comp.changes.reduce((a, c) => a + c.add, 0);
            const del = comp.changes.reduce((a, c) => a + c.del, 0);
            return h(
              "div",
              { class: "t-card" },
              h(
                "div",
                { class: "t-card-head" },
                icon("fileDiff"),
                h(
                  "div",
                  { class: "t-card-title" },
                  `Edited ${plural(comp.changes.length, ["file", "files"])}`,
                  h(
                    "span",
                    { class: "tnum", style: { "font-size": "12px" } },
                    h("span", { class: "add" }, `+${add}`),
                    " / ",
                    h("span", { class: "del" }, `-${del}`),
                  ),
                ),
                h("span", { style: { flex: "1" } }),
                h("button", { class: "ch-act", type: "button" }, "Undo", icon("undo")),
                h(
                  "button",
                  { class: "ch-act", type: "button" },
                  "Review changes",
                  icon("chevronDown"),
                ),
              ),
              comp.changes
                .slice(0, 6)
                .map((c) =>
                  h(
                    "div",
                    { class: "t-card-file" },
                    h("span", { class: "t-ts" }, "TS"),
                    h("span", { style: { flex: "1" } }, c.path),
                    h(
                      "span",
                      { class: "tnum", style: { "font-size": "12px" } },
                      h("span", { class: "add" }, `+${c.add}`),
                      " / ",
                      h("span", { class: "del" }, `-${c.del}`),
                    ),
                  ),
                ),
            );
          },
        };
      }

      /* ==========================================================
         A · Ledger — one quiet rail, every step on it
         ========================================================== */
      function mountA(host, { comp }) {
        const root = h("div", { class: "a-run", "data-phase": "working" });
        const body = h("div", { class: "a-body" });
        const railMark = h("span", { class: "a-railmark" });
        const list = createStepList({ merge: true, thinkWin: true });
        body.append(h("span", { class: "a-rail" }), railMark, list.el);
        let open = true;
        const head = createRunHead({ onToggle: () => setOpen(!open) });
        const chips = createChips({ diff: false });
        head.sum.append(chips.el);
        root.append(head.el, body);
        host.append(root);
        const proses = [];
        const streams = new Map();
        let activeEl = null;
        let railY = -1;
        let railH = -1;

        function setOpen(next) {
          open = next;
          head.setOpen(open);
          if (!open) leave(body, () => (body.hidden = true), { dur: 460, y: -6 });
          else {
            body.hidden = false;
            enter(body, { blur: 0, dur: 480 });
            [...list.el.children]
              .slice(0, 28)
              .forEach((c, i) => fadeIn(c, { delay: 60 + i * 16, y: 8 }));
          }
        }
        function clampProse(p, on) {
          morphHeight(p, () => p.classList.toggle("clamped", on));
        }
        return {
          start(b) {
            if (b.t === "say") {
              for (const p of proses)
                if (!p.classList.contains("clamped") && !p.dataset.pinned) clampProse(p, true);
              const p = h("p", { class: "a-prose prose" });
              p.addEventListener("click", () => {
                if (!p.classList.contains("clamped") && !p.dataset.pinned) return;
                const pin = p.classList.contains("clamped");
                p.dataset.pinned = pin ? "1" : "";
                clampProse(p, !pin);
              });
              list.appendBlock(p);
              proses.push(p);
              streams.set(b.id, streamer(p, b.text));
              activeEl = p;
              return;
            }
            activeEl = list.start(b).el;
            if (b.t === "tool") chips.count(b);
          },
          progress(b, f) {
            if (b.t === "say") streams.get(b.id).set(f);
            else list.progress(b, f);
          },
          end(b) {
            if (b.t === "say") streams.get(b.id).finish();
            else {
              list.end(b);
              if (b.t === "tool") chips.end(b);
            }
          },
          tick(sim) {
            if (root.dataset.phase === "working") head.tick(sim);
            list.tick(sim);
            if (activeEl?.isConnected && !body.hidden) {
              const y = activeEl.offsetTop + 6;
              const hh = clamp(activeEl.offsetHeight - 12, 14, 160);
              if (y !== railY || hh !== railH) {
                railY = y;
                railH = hh;
                railMark.style.transform = `translateY(${y}px)`;
                railMark.style.height = `${hh}px`;
              }
            }
          },
          finalStart() {
            root.dataset.phase = "done";
            head.done(comp.workDur);
            setOpen(false);
          },
        };
      }

      /* ==========================================================
         B · Track — the run as a live timeline; updates collapse
         into markers on it
         ========================================================== */
      function mountB(host, { comp }) {
        const root = h("div", { class: "b-run", "data-phase": "working" });
        let logOpen = false;
        const head = createRunHead({ onToggle: () => toggleLog() });
        head.setOpen(false);
        const marks = h("div", { class: "b-marks" });
        const lane = h("div", { class: "b-lane" });
        const playhead = h("div", { class: "b-playhead" });
        const popEl = h("div", { class: "b-pop" });
        const track = h("div", { class: "b-track" }, marks, lane, playhead, popEl);
        const capGlyph = glyph("dot");
        const capText = h("span", { class: "b-cap-text roll" });
        const capMeta = h("span", { class: "b-cap-meta tnum" });
        const cap = h("div", { class: "b-cap" }, capGlyph, capText, capMeta);
        const para = h("div", { class: "b-para prose" });
        const log = h("div", { class: "b-log", hidden: true });
        root.append(head.el, track, cap, para, log);
        host.append(root);

        const chips = createChips({ diff: false });
        const segs = new Map();
        const markers = [];
        const logChapters = new Map();
        const streams = new Map();
        const runningBeats = new Set();
        let lastDone = null;
        let capKey = "";
        let capTail = null;
        let capBeat = null;
        let paraBeat = null;
        let paraStream = null;
        let win = 40;
        let simNow = 0;
        let done = false;
        let hover = null;
        swapRoll(capText, "Starting", 1, "start");

        function logChapter(i) {
          let c = logChapters.get(i);
          if (c) return c;
          const p = h("p", { class: "prose" });
          const steps = createStepList();
          c = { el: h("div", { class: "b-log-ch" }, p, steps.el), p, steps };
          logChapters.set(i, c);
          log.append(c.el);
          return c;
        }
        function toggleLog(force) {
          logOpen = force ?? !logOpen;
          head.setOpen(logOpen);
          morphHeight(root, () => {
            log.hidden = !logOpen;
            para.hidden = logOpen;
          });
        }
        const scale = () => (lane.clientWidth || 600) / win;
        function segBounds(b) {
          const s = scale();
          const x0 = b.sStart * s;
          const end = b._done ? b.sStart + b.sDur : Math.max(b.sStart, simNow);
          return [x0, Math.max(2, end * s - x0 - 1)];
        }

        /* caption: what is happening right now */
        function paintCaption() {
          if (done) return;
          const run = [...runningBeats];
          let key;
          let content;
          let state;
          let beat = null;
          if (run.length > 1 && run.every((b) => b.kind === run[0].kind)) {
            const k = KIND[run[0].kind];
            key = `multi:${run[0].kind}:${run.length}`;
            content = [`${k.live} `, h("span", null, plural(run.length, k.noun))];
            state = "run";
          } else if (run.length) {
            beat = run[run.length - 1];
            key = `run:${beat.id}`;
            state = beat.t === "think" ? "think" : "run";
            if (beat.t === "think") {
              capTail = h("span", { style: { color: "var(--faint-fg)", "margin-left": "6px" } });
              content = [h("span", { class: "shimmer-text" }, "Thinking"), capTail];
            } else
              content = [
                `${KIND[beat.kind].live} `,
                h("span", { class: isMono(beat) ? "mono" : "" }, targetText(beat)),
              ];
          } else if (lastDone) {
            beat = lastDone;
            key = `done:${beat.id}`;
            state = beat.t === "think" ? "thought" : beat.ok === false ? "fail" : "ok";
            content =
              beat.t === "think"
                ? [`Thought for ${fmtDur(beat.sDur)}`]
                : [
                    `${KIND[beat.kind].done} `,
                    h("span", { class: isMono(beat) ? "mono" : "" }, targetText(beat)),
                  ];
          } else return;
          if (key === capKey) return;
          capKey = key;
          capBeat = beat;
          setGlyph(capGlyph, state);
          swapRoll(capText, content, 1, key);
          capMeta.textContent = "";
          if (beat && !runningBeats.has(beat)) {
            const r = resultMeta([beat]);
            if (r)
              capMeta.replaceChildren(
                r.kind === "node" ? r.node : r.kind === "count" ? r.fmt(r.n) : r.text,
              );
          }
        }

        /* the ¶ markers: each update folds into one */
        function addMarker(b, cls = "") {
          const m = h("button", {
            class: `b-mark ${cls}`,
            type: "button",
            "aria-label": "Show update",
          });
          m._beat = b;
          m.addEventListener("pointerenter", () => showPop(m));
          m.addEventListener("pointerleave", hidePop);
          m.addEventListener("click", () => {
            if (b.t !== "say") return;
            toggleLog(true);
            const c = logChapters.get(b.ch);
            requestAnimationFrame(() =>
              c?.p.scrollIntoView({ block: "center", behavior: motion ? "smooth" : "auto" }),
            );
          });
          marks.append(m);
          markers.push(m);
          if (live())
            m.animate(
              [
                { transform: "scale(0)" },
                { transform: "scale(1.5)", offset: 0.6 },
                { transform: "scale(1)" },
              ],
              { duration: 420, easing: EASE },
            );
          return m;
        }
        function flyIntoMarker(marker) {
          if (!para.childNodes.length) return;
          if (!live() || logOpen) {
            para.replaceChildren();
            return;
          }
          const rr = root.getBoundingClientRect();
          const pr = para.getBoundingClientRect();
          const ghost = para.cloneNode(true);
          ghost.classList.add("b-ghost");
          ghost.classList.remove("caret");
          Object.assign(ghost.style, {
            left: `${pr.left - rr.left}px`,
            top: `${pr.top - rr.top}px`,
            width: `${pr.width}px`,
          });
          root.append(ghost);
          morphHeight(para, () => para.replaceChildren(), { dur: 420 });
          const mr = marker.getBoundingClientRect();
          const dx = mr.left + mr.width / 2 - pr.left;
          const dy = mr.top + mr.height / 2 - pr.top;
          ghost.animate(
            [
              { transform: "none", opacity: 1, filter: "blur(0px)" },
              {
                transform: `translate(${dx * 0.35}px, ${dy * 0.5}px) scale(0.45)`,
                opacity: 0.55,
                filter: "blur(1px)",
                offset: 0.55,
              },
              {
                transform: `translate(${dx}px, ${dy}px) scale(0.01)`,
                opacity: 0,
                filter: "blur(4px)",
              },
            ],
            { duration: 640, easing: "cubic-bezier(.55,0,.25,1)", fill: "forwards" },
          ).onfinish = () => {
            ghost.remove();
            pop(marker, 1.8);
          };
        }

        /* hover: segments + markers explain themselves */
        function showPop(target, x) {
          hover = target;
          const b = target._beat ?? target;
          let content;
          if (target.classList?.contains("b-mark")) {
            marks.querySelectorAll(".hot").forEach((n) => n.classList.remove("hot"));
            target.classList.add("hot");
            content =
              b.t === "final"
                ? [
                    h("div", { class: "pop-para" }, "Final answer"),
                    h("div", { class: "pop-sub" }, fmtWall(b.sStart)),
                  ]
                : [
                    h("div", { class: "pop-para" }, renderInline(b.text)),
                    h("div", { class: "pop-sub" }, `Update ${b.ch + 1} · ${fmtWall(b.sStart)}`),
                  ];
            x = target.offsetLeft;
          } else {
            const r = b._done ? resultMeta([b]) : null;
            content = [
              h(
                "div",
                { class: "pop-title" },
                glyph(
                  b.t === "think"
                    ? b._done
                      ? "thought"
                      : "think"
                    : !b._done
                      ? "run"
                      : b.ok === false
                        ? "fail"
                        : "ok",
                ),
                b.t === "think"
                  ? b._done
                    ? `Thought for ${fmtDur(b.sDur)}`
                    : "Thinking"
                  : `${b._done ? KIND[b.kind].done : KIND[b.kind].live} `,
                b.t === "tool"
                  ? h("span", { class: isMono(b) ? "mono" : "" }, targetText(b))
                  : null,
              ),
              h(
                "div",
                { class: "pop-sub" },
                [
                  fmtWall(b.sStart),
                  b._done ? fmtDur(b.sDur) : "running",
                  r ? (r.kind === "count" ? r.fmt(r.n) : r.kind === "text" ? r.text : null) : null,
                ]
                  .filter(Boolean)
                  .join(" · "),
                r?.kind === "node" ? [" · ", r.node] : null,
              ),
            ];
          }
          popEl.replaceChildren(...content);
          const tw = track.clientWidth;
          const pw = Math.min(420, popEl.offsetWidth);
          popEl.style.left = `${clamp(x - pw / 2, 0, tw - pw)}px`;
          popEl.classList.add("show");
        }
        function hidePop() {
          hover = null;
          popEl.classList.remove("show");
          lane.classList.remove("hovering");
          lane.querySelectorAll(".hot").forEach((n) => n.classList.remove("hot"));
          marks.querySelectorAll(".hot").forEach((n) => n.classList.remove("hot"));
        }
        function beatAtX(x) {
          let best = null;
          let bestD = 7;
          for (const [b] of segs) {
            const [x0, w] = segBounds(b);
            const d = x < x0 ? x0 - x : x > x0 + w ? x - x0 - w : 0;
            if (d < bestD || (d === 0 && best && w < segBounds(best)[1])) {
              best = b;
              bestD = d;
            }
          }
          return best;
        }
        lane.addEventListener("pointermove", (e) => {
          const x = e.clientX - lane.getBoundingClientRect().left;
          const b = beatAtX(x);
          if (!b) return hidePop();
          lane.classList.add("hovering");
          lane.querySelectorAll(".hot").forEach((n) => n.classList.remove("hot"));
          segs.get(b).classList.add("hot");
          showPop(b, x);
        });
        lane.addEventListener("pointerleave", hidePop);
        lane.addEventListener("click", (e) => {
          const b = beatAtX(e.clientX - lane.getBoundingClientRect().left);
          if (!b) return;
          toggleLog(true);
          const row = logChapters.get(b.ch)?.steps.row(b.id);
          if (row)
            requestAnimationFrame(() => {
              row.el.scrollIntoView({ block: "center", behavior: motion ? "smooth" : "auto" });
              row.flash();
            });
        });

        return {
          start(b) {
            const lc = logChapter(b.ch);
            if (b.t === "say") {
              const prev = markers.filter((m) => m._beat.t === "say").pop();
              prev?.classList.remove("cur");
              if (prev) flyIntoMarker(prev);
              addMarker(b, "cur");
              paraBeat = b;
              paraStream = streamer(para, b.text);
              streams.set(b.id, streamer(lc.p, b.text, { caret: false }));
              return;
            }
            lc.steps.start(b);
            const seg = h("span", {
              class: `b-seg live${b.ok === false ? "" : ""}`,
              "data-kind": b.t === "think" ? "think" : b.kind,
            });
            segs.set(b, seg);
            lane.append(seg);
            if (live())
              seg.animate([{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], {
                duration: 360,
                easing: SNAPPY,
              });
            runningBeats.add(b);
            if (b.t === "tool") chips.count(b);
            paintCaption();
          },
          progress(b, f) {
            if (b.t === "say") {
              if (b === paraBeat) paraStream.set(f);
              streams.get(b.id)?.set(f);
              return;
            }
            logChapters.get(b.ch)?.steps.progress(b, f);
            if (b.t === "think" && b === capBeat && capTail) {
              const n = Math.floor(f * b.text.length);
              const s = b.text.slice(Math.max(0, n - 56), n);
              capTail.textContent = n > 56 ? `…${s.slice(s.indexOf(" ") + 1)}` : s;
            }
          },
          end(b) {
            if (b.t === "say") {
              if (b === paraBeat) paraStream.finish();
              streams.get(b.id)?.finish();
              return;
            }
            logChapters.get(b.ch)?.steps.end(b);
            const seg = segs.get(b);
            seg.classList.remove("live");
            if (b.ok === false) {
              seg.classList.add("fail");
              if (live())
                seg.animate([{ transform: "scaleY(1.6)" }, { transform: "scaleY(1)" }], {
                  duration: 420,
                  easing: SNAPPY,
                });
            }
            runningBeats.delete(b);
            lastDone = b;
            if (b.t === "tool") chips.end(b);
            paintCaption();
          },
          tick(sim) {
            simNow = sim;
            if (!done) {
              head.tick(sim);
              win = Math.max(40, sim * 1.06);
            } else win += (comp.workDur - win) * (live() ? 0.12 : 1);
            const s = scale();
            for (const [b, seg] of segs) {
              const [x0, w] = segBounds(b);
              seg.style.left = `${x0}px`;
              seg.style.width = `${w}px`;
            }
            for (const m of markers) m.style.left = `${m._beat.sStart * s}px`;
            playhead.style.left = `${Math.min(lane.clientWidth, sim * s)}px`;
            if (!done) {
              const b = capBeat && runningBeats.has(capBeat) ? capBeat : null;
              if (b && (b.t === "think" || ["run", "web", "agent"].includes(b.kind))) {
                const t = fmtTimer(sim - b.sStart);
                if (capMeta.textContent !== t && sim - b.sStart >= 1) capMeta.textContent = t;
              }
            }
            for (const c of logChapters.values()) c.steps.tick(sim);
          },
          finalStart() {
            done = true;
            root.dataset.phase = "done";
            head.done(comp.workDur);
            const prev = markers.filter((m) => m._beat.t === "say").pop();
            prev?.classList.remove("cur");
            if (prev) flyIntoMarker(prev);
            addMarker(comp.final, "final");
            setGlyph(capGlyph, "ok");
            swapRoll(capText, chips.el, 1, "summary");
            capMeta.textContent = plural(comp.tools.length, ["step", "steps"]);
          },
        };
      }

      /* ==========================================================
         C · Chapters — each update is a chapter; finished ones fold
         to a single line, the live one keeps a 3-row ticker
         ========================================================== */
      function mountC(host, { comp }) {
        const root = h("div", { class: "c-run", "data-phase": "working" });
        let open = true;
        const head = createRunHead({ onToggle: () => setOpen(!open) });
        const line = h(
          "div",
          { class: "c-line" },
          h("div", { class: "c-fill" }),
          h("div", { class: "c-flow" }),
        );
        const chs = h("div", { class: "c-chs" }, line);
        root.append(head.el, chs);
        host.append(root);
        const chapters = [];
        let active = null;
        let lineKey = "";

        function setOpen(next) {
          open = next;
          head.setOpen(open);
          if (!open) leave(chs, () => (chs.hidden = true), { dur: 420 });
          else {
            chs.hidden = false;
            enter(chs, { blur: 0 });
          }
        }

        function createChapter(meta) {
          const node = h("span", { class: "c-node" });
          const title = h("span", { class: "c-title ghost" });
          const dur = h("span", { class: "c-dur tnum" }, "0s");
          const chips = createChips();
          const metaBox = h("span", { style: { display: "contents" } }, chips.el, dur);
          const top = h("button", { class: "c-top", type: "button" }, title);
          const para = h("p", { class: "c-para prose" });
          const ch = { meta, state: "active", userOpen: false, streams: null, lastSec: -1 };
          const ticker = createStepList({ window: 3, onMore: () => expand(ch, true) });
          const full = createStepList();
          full.el.hidden = true;
          const foot = h("div", { class: "c-foot" });
          const body = h("div", { class: "c-body" }, para, ticker.el, full.el, foot);
          const el = h(
            "section",
            { class: "c-ch", "data-state": "active", "data-open": "true" },
            node,
            top,
            body,
          );
          foot.append(chips.el, dur);
          Object.assign(ch, {
            el,
            node,
            title,
            dur,
            chips,
            top,
            para,
            ticker,
            full,
            foot,
            body,
            metaBox,
          });
          top.addEventListener("click", () => expand(ch, true));
          foot.addEventListener("click", () => {
            if (ch.state === "done") expand(ch, false);
          });
          title.textContent = "Thinking";
          return ch;
        }
        /** Move chips + duration between the open footer and the folded title row (FLIP). */
        function moveMeta(ch, to) {
          const nodes = [ch.chips.el, ch.dur];
          const first = nodes.map((n) => n.getBoundingClientRect());
          to.append(...nodes);
          return () => {
            if (!live()) return;
            nodes.forEach((n, i) => {
              const last = n.getBoundingClientRect();
              const dx = first[i].left - last.left;
              const dy = first[i].top - last.top;
              if (Math.abs(dx) + Math.abs(dy) > 1)
                n.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], {
                  duration: 520,
                  easing: GENTLE,
                });
            });
          };
        }
        function fold(ch) {
          ch.state = "done";
          ch.el.dataset.state = "done";
          ch.dur.textContent = fmtDur(ch.meta.sEnd - ch.meta.sStart);
          if (!ch.meta.say) {
            ch.title.textContent = `Thought for ${fmtDur(ch.meta.sEnd - ch.meta.sStart)}`;
          }
          collapse(ch);
        }
        function collapse(ch) {
          let play;
          morphHeight(
            ch.el,
            () => {
              ch.el.dataset.open = "false";
              ch.body.hidden = true;
              play = moveMeta(ch, ch.top);
            },
            { dur: 460 },
          );
          play?.();
          fadeIn(ch.title, { y: 8, dur: 420 });
          ch.userOpen = false;
        }
        function expand(ch, on) {
          if (ch.state === "active") {
            // live chapter: "N earlier steps" swaps the ticker for the full list
            morphHeight(ch.el, () => {
              ch.ticker.el.hidden = on;
              ch.full.el.hidden = !on;
            });
            return;
          }
          if (!on) return collapse(ch);
          let play;
          morphHeight(
            ch.el,
            () => {
              ch.el.dataset.open = "true";
              ch.body.hidden = false;
              ch.ticker.el.hidden = true;
              ch.full.el.hidden = false;
              play = moveMeta(ch, ch.foot);
            },
            { dur: 460 },
          );
          play?.();
          ch.userOpen = true;
        }
        function chapterFor(b) {
          let ch = chapters[b.ch];
          if (ch) return ch;
          if (active) fold(active);
          ch = createChapter(comp.chapters[b.ch]);
          chapters[b.ch] = ch;
          chs.append(ch.el);
          enter(ch.el, { dur: 460 });
          if (live())
            ch.node.animate(
              [
                { transform: "scale(0)" },
                { transform: "scale(1.4)", offset: 0.6 },
                { transform: "scale(1)" },
              ],
              { duration: 480, delay: 120, easing: EASE, fill: "backwards" },
            );
          active = ch;
          return ch;
        }
        function paintLine() {
          const list = chapters.filter(Boolean);
          if (!list.length) return;
          const y0 = list[0].el.offsetTop + 15;
          const lastEl = list[list.length - 1].el;
          const working = root.dataset.phase === "working";
          const end = working ? lastEl.offsetTop + lastEl.offsetHeight - 8 : lastEl.offsetTop + 15;
          const fill = (active && working ? active.el.offsetTop + 15 : end) - y0;
          const key = `${y0}|${end}|${fill}`;
          if (key === lineKey) return;
          lineKey = key;
          line.style.top = `${y0}px`;
          line.style.setProperty("--len", `${Math.max(0, end - y0)}px`);
          line.style.setProperty("--fill", `${Math.max(0, fill)}px`);
        }

        return {
          start(b) {
            const ch = chapterFor(b);
            if (b.t === "say") {
              ch.title.classList.remove("ghost");
              ch.title.replaceChildren(...renderInline(b.text));
              ch.stream = streamer(ch.para, b.text);
              return;
            }
            ch.ticker.start(b);
            ch.full.start(b);
            if (b.t === "tool") ch.chips.count(b);
          },
          progress(b, f) {
            const ch = chapters[b.ch];
            if (b.t === "say") ch.stream.set(f);
            else {
              ch.ticker.progress(b, f);
              ch.full.progress(b, f);
            }
          },
          end(b) {
            const ch = chapters[b.ch];
            if (b.t === "say") ch.stream.finish();
            else {
              ch.ticker.end(b);
              ch.full.end(b);
              if (b.t === "tool") ch.chips.end(b);
            }
          },
          tick(sim) {
            if (root.dataset.phase === "working") head.tick(sim);
            if (active?.state === "active") {
              const s = Math.floor(sim - active.meta.sStart);
              if (s !== active.lastSec && s >= 0) {
                active.lastSec = s;
                active.dur.textContent = fmtTimer(s);
              }
              active.ticker.tick(sim);
              active.full.tick(sim);
            }
            if (!chs.hidden) paintLine();
          },
          finalStart() {
            root.dataset.phase = "done";
            if (active) fold(active);
            head.done(comp.workDur);
          },
        };
      }

      /* ==========================================================
         Directions + notes
         ========================================================== */
      const DIRS = {
        T: {
          name: "Today",
          mount: mountToday,
          notes: [
            [
              "What ships",
              "MessagesTimeline as it is: a “Working for” fold, assistant updates as full paragraphs with a 10px timestamp, and runs of tool calls folded into one summary row (“Ran 13 commands, Edited 1 file”).",
            ],
            [
              "Live",
              "No spinner and no per-step state. The only signals are the timer, “· Running” on the open group and a “Thinking” shimmer with no content.",
            ],
            [
              "Density",
              "Every update stays at full height, so three updates plus their groups fill the pane. When the turn settles, everything except the answer folds away.",
            ],
            [
              "Gap",
              "Reasoning is not shown. Adapters stream it, but ingestion keeps only assistant_text. Directions A–C assume it is projected as a thinking entry.",
            ],
          ],
        },
        A: {
          name: "Ledger",
          mount: mountA,
          notes: [
            [
              "Live",
              "Every step is a row on one quiet rail: a spinner that draws into a check, a verb that rolls from “Reading” to “Read”, and a live timer on long commands. A marker on the rail glides to whatever is happening now.",
            ],
            [
              "Density",
              "Back-to-back reads and searches merge into one row (“Read 4 files”) with a rolling count. Older updates clamp to one line and expand on click. Reasoning streams through a two-line window, then becomes “Thought for 6s”.",
            ],
            [
              "Motion",
              "Rows grow in from a blur, results count up, diffstats tick. The header tallies files, searches, edits and commands as they happen. At the end the ledger folds into “Worked for”.",
            ],
            [
              "Build",
              "Closest to today. It reuses the work-group rows with a status glyph per entry and merges by kind instead of summarising mixed runs. Lowest risk: same rows, just better states.",
            ],
          ],
        },
        B: {
          name: "Track",
          mount: mountB,
          notes: [
            [
              "Live",
              "The run is drawn as a timeline. Each step is a bar whose width is its real duration and whose height and tint show its kind, so a 40s typecheck reads very differently from a burst of reads. A playhead records it live, and one caption says what is happening now.",
            ],
            [
              "Density",
              "Only the latest update is shown as text. When the next one starts, the previous paragraph shrinks into a marker on the track. Hover any bar or marker to read it; click to open the full log at that step.",
            ],
            [
              "Motion",
              "Bars grow from the centre, the scale compresses as the run gets longer, failed bars flare red, paragraphs fly into their markers, and the caption rolls between steps. At the end the caption becomes the run’s tallies.",
            ],
            [
              "Build",
              "Needs startedAt and a completion time per work entry (both already exist) plus a small SVG/DOM lane. The most distinctive option and the most compact: about three lines plus the current update.",
            ],
          ],
        },
        C: {
          name: "Chapters",
          mount: mountC,
          notes: [
            [
              "Live",
              "Each update the model writes opens a chapter. The live chapter shows its full paragraph and a three-row ticker of steps. Older steps scroll out of the top into a “12 earlier steps” link.",
            ],
            [
              "Density",
              "When the next update starts, the finished chapter folds to one line: the update’s text, its per-kind tallies and its duration. A long run reads as a short table of contents.",
            ],
            [
              "Motion",
              "Tallies and duration slide from the footer into the title line as the chapter folds. The connecting line fills down to the new node, and a pulse travels the active segment.",
            ],
            [
              "Build",
              "Groups work entries by the assistant message that precedes them, which deriveTurnFolds already knows. Reuses Ledger’s rows inside each chapter. A medium-sized change with the strongest story structure.",
            ],
          ],
        },
      };

      /* ==========================================================
         Player
         ========================================================== */
      const thread = $("#thread");
      const scroller = $("#scroller");
      const state = {
        dir: "A",
        scn: "fixtures",
        comp: null,
        P: 0,
        playing: true,
        speed: 1,
      };
      let view = null;
      let stick = true;
      let stickUntil = 0;

      function build() {
        for (const b of state.comp.beats) b._started = b._done = false;
        thread.replaceChildren();
        const scn = state.comp.scn;
        const user = h("div", { class: "msg-user" }, scn.prompt);
        const runHost = h("div");
        const finalEl = h("p", { class: "prose final" });
        const finalMeta = h("div", { class: "t-meta", hidden: true });
        const after = h("div");
        thread.append(user, runHost, h("div", null, finalEl, finalMeta), after);
        view = {
          runHost,
          finalEl,
          finalMeta,
          after,
          dir: DIRS[state.dir].mount(runHost, { comp: state.comp }),
          finalStream: null,
          finished: false,
        };
      }
      function route(type, b, f) {
        if (b.t === "final") {
          if (type === "start") {
            view.dir.finalStart?.(state.comp);
            view.finalStream = streamer(view.finalEl, b.text);
          } else if (type === "progress") view.finalStream.set(f);
          else {
            view.finalStream.finish();
            if (view.dir.finalMeta) {
              view.finalMeta.hidden = false;
              view.finalMeta.textContent = view.dir.finalMeta(b);
            }
          }
          return;
        }
        view.dir[type]?.(b, f);
      }
      function advance(P) {
        const comp = state.comp;
        for (const b of comp.beats) {
          if (b.pStart > P) break;
          if (!b._started) {
            b._started = true;
            route("start", b);
          }
          if (!b._done) {
            const f = clamp((P - b.pStart) / b.pDur, 0, 1);
            route("progress", b, f);
            if (f >= 1) {
              b._done = true;
              route("end", b);
            }
          }
        }
        if (P >= comp.pTotal && !view.finished) {
          view.finished = true;
          if (comp.changes.length) {
            const el = view.dir.renderChanges?.() ?? createChanges(comp.changes);
            view.after.append(el);
            enter(el, { blur: 0 });
          }
          state.playing = false;
          stickUntil = performance.now() + 1200;
        }
      }
      /** Rebuild instantly at play-time P (seek / direction switch). */
      function seek(P) {
        state.P = clamp(P, 0, state.comp.pTotal);
        INSTANT = true;
        try {
          build();
          advance(state.P);
          view.dir.tick?.(simAt(state.comp, state.P), state.P);
        } finally {
          INSTANT = false;
        }
        stick = true;
        scroller.scrollTop = scroller.scrollHeight;
      }
      function load(id) {
        state.scn = id;
        state.comp = compile(SCENARIOS.find((s) => s.id === id));
        for (const b of $("#scenarios").querySelectorAll(".scenario"))
          b.setAttribute("aria-pressed", String(b.dataset.id === id));
        paintTicks();
        seek(0);
        state.playing = true;
      }

      scroller.addEventListener("scroll", () => {
        stick = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 48;
      });

      let lastTs = performance.now();
      function frame(ts) {
        const dt = Math.min(64, ts - lastTs);
        lastTs = ts;
        if (state.playing && !view.finished) {
          state.P = Math.min(state.comp.pTotal, state.P + dt * state.speed);
          advance(state.P);
        }
        view.dir.tick?.(simAt(state.comp, state.P), state.P);
        paintTransport();
        if (stick && (state.playing || ts < stickUntil)) scroller.scrollTop = scroller.scrollHeight;
        requestAnimationFrame(frame);
      }

      /* ==========================================================
         Lab chrome: tabs, scenarios, transport
         ========================================================== */
      const tabs = segmented(
        Object.entries(DIRS).map(([id, d]) => ({
          id,
          content: [h("b", null, id === "T" ? "0" : id), d.name],
        })),
        state.dir,
        (id) => mountDir(id),
        { label: "Direction", cls: "lab-tabs" },
      );
      $("#tabs-slot").append(tabs.el);

      function mountDir(id) {
        state.dir = id;
        tabs.set(id);
        $("#notes").replaceChildren(
          ...DIRS[id].notes.map(([t, p]) => h("div", null, h("h3", null, t), h("p", null, p))),
        );
        history.replaceState(null, "", `#${id}`);
        if (state.comp) {
          const wasPlaying = state.playing;
          seek(state.P);
          state.playing = wasPlaying;
        }
      }

      for (const s of SCENARIOS)
        $("#scenarios").append(
          h(
            "button",
            {
              class: "scenario",
              type: "button",
              "data-id": s.id,
              "aria-pressed": "false",
              onclick: () => load(s.id),
            },
            s.label,
            h("small", null, s.hint),
          ),
        );

      const playBtn = $("#play-btn");
      const sendBtn = $("#send-btn");
      let paintedPlaying = null;
      function togglePlay() {
        if (view.finished) {
          seek(0);
          state.playing = true;
          return;
        }
        state.playing = !state.playing;
      }
      playBtn.addEventListener("click", togglePlay);
      sendBtn.addEventListener("click", togglePlay);
      $("#restart-btn").append(icon("rotateCcw"));
      $("#restart-btn").addEventListener("click", () => {
        seek(0);
        state.playing = true;
      });
      $("#end-btn").append(icon("skipEnd"));
      $("#end-btn").addEventListener("click", () => seek(state.comp.pTotal));
      $("#cmp-model").append(claudeMark(), "Opus 5.5");

      const speed = segmented(
        [0.5, 1, 2, 4].map((v) => ({ id: String(v), label: `${v}×` })),
        "1",
        (v) => {
          state.speed = Number(v);
          speed.set(v);
        },
        { label: "Speed" },
      );
      $("#speed-slot").append(speed.el);

      const scrub = $("#scrub");
      const scrubFill = $("#scrub-fill");
      const scrubThumb = $("#scrub-thumb");
      const tpTime = $("#tp-time");
      function paintTicks() {
        const comp = state.comp;
        $("#scrub-ticks").replaceChildren(
          ...comp.beats
            .filter((b) => b.t === "say" || b.t === "final")
            .map((b) =>
              h("span", {
                class: `scrub-tick ${b.t === "final" ? "final" : ""}`,
                style: { left: `${(b.pStart / comp.pTotal) * 100}%` },
              }),
            ),
        );
      }
      let lastPaint = "";
      function paintTransport() {
        const comp = state.comp;
        const pct = (state.P / comp.pTotal) * 100;
        const t = `${fmtClock(simAt(comp, state.P))} / ${fmtClock(comp.sTotal)}`;
        const playing = state.playing && !view.finished;
        const key = `${pct.toFixed(2)}|${t}|${playing}`;
        if (key === lastPaint) return;
        lastPaint = key;
        scrubFill.style.width = `${pct}%`;
        scrubThumb.style.left = `${pct}%`;
        tpTime.textContent = t;
        if (paintedPlaying !== playing) {
          paintedPlaying = playing;
          playBtn.replaceChildren(icon(playing ? "pause" : "play"));
          playBtn.setAttribute("aria-label", playing ? "Pause" : "Play");
          sendBtn.className = `send ${playing ? "stop" : ""}`;
          sendBtn.replaceChildren(icon(playing ? "square" : "arrowUp"));
        }
      }
      let dragging = false;
      let resumeAfterDrag = false;
      let pendingSeek = null;
      function scrubTo(e) {
        const r = scrub.getBoundingClientRect();
        const P = clamp((e.clientX - r.left) / r.width, 0, 1) * state.comp.pTotal;
        if (pendingSeek == null)
          requestAnimationFrame(() => {
            seek(pendingSeek);
            pendingSeek = null;
          });
        pendingSeek = P;
      }
      scrub.addEventListener("pointerdown", (e) => {
        dragging = true;
        resumeAfterDrag = state.playing && !view.finished;
        state.playing = false;
        scrub.setPointerCapture(e.pointerId);
        scrubTo(e);
      });
      scrub.addEventListener("pointermove", (e) => dragging && scrubTo(e));
      scrub.addEventListener("pointerup", () => {
        dragging = false;
        requestAnimationFrame(() => {
          if (resumeAfterDrag && !view.finished) state.playing = true;
        });
      });
      scrub.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        e.preventDefault();
        e.stopPropagation();
        seek(state.P + (e.key === "ArrowLeft" ? -1 : 1) * state.comp.pTotal * 0.04);
      });

      const themeBtn = $("#theme-btn");
      function paintThemeBtn() {
        const dark = document.documentElement.classList.contains("dark");
        themeBtn.replaceChildren(icon(dark ? "moon" : "sun"), dark ? "Dark" : "Light");
      }
      themeBtn.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        paintThemeBtn();
      });
      paintThemeBtn();
      const motionBtn = $("#motion-btn");
      function paintMotion() {
        document.documentElement.dataset.motion = motion ? "on" : "off";
        motionBtn.setAttribute("aria-pressed", String(motion));
        motionBtn.textContent = motion ? "Motion on" : "Motion off";
      }
      motionBtn.addEventListener("click", () => {
        motion = !motion;
        paintMotion();
      });
      paintMotion();

      document.addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey || e.target.matches?.("input, textarea")) return;
        const id = { 0: "T", 1: "A", 2: "B", 3: "C" }[e.key];
        if (id) return mountDir(id);
        if (e.key === " ") {
          e.preventDefault();
          togglePlay();
        } else if (e.key === "r") {
          seek(0);
          state.playing = true;
        } else if (e.key === "e") seek(state.comp.pTotal);
        else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
          e.preventDefault();
          seek(state.P + (e.key === "ArrowLeft" ? -1 : 1) * state.comp.pTotal * 0.04);
        }
      });

      $("#notes-foot").append(
        "Today mirrors ",
        h("code", null, "MessagesTimeline"),
        " (turn fold, summarizeToolCallGroup labels, the “Thinking” placeholder). A–C need two data changes: project ",
        h("code", null, "reasoning_text"),
        " into a thinking work entry (it is dropped in ProviderRuntimeIngestion today), and give each entry a completion time next to ",
        h("code", null, "startedAt"),
        ". Kinds come from itemType, requestKind and deriveReadableCommandDisplay. Keys: Space play/pause · R restart · E end · ←/→ seek · 0–3 directions.",
      );

      const initial = location.hash.slice(1).toUpperCase();
      state.dir = DIRS[initial] ? initial : "A";
      tabs.sync(false);
      tabs.set(state.dir);
      $("#notes").replaceChildren(
        ...DIRS[state.dir].notes.map(([t, p]) => h("div", null, h("h3", null, t), h("p", null, p))),
      );
      load("fixtures");
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
